<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f2f5f6">
<title>GY:ON — 나의 기회 보드</title>

<style id="newDesign">
/* 기본 */
*{box-sizing:border-box}
:root{
  --ink:#293844;
  --muted:#7b8992;
  --purple:#243e48;
  --light:#e9eff1;
  --line:#dfe6e9;
}
body{
  margin:0;
  background:#f2f5f6;
  color:var(--ink);
  font-family:Pretendard,"Malgun Gothic",system-ui,sans-serif;
}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
button:focus-visible,a:focus-visible{
  outline:3px solid #fcad7f;
  outline-offset:3px;
}
[hidden]{display:none!important}
.header{display:none}
.wrap{max-width:none;margin:0;padding:0}
.dashboard-main{
  margin-left:244px!important;
  padding:32px 40px!important;
  max-width:1600px;
}

/* 왼쪽 메뉴 */
.sidebar{
  position:fixed;
  inset:0 auto 0 0;
  width:244px;
  padding:32px 22px;
  background:#fff;
  border-right:1px solid #e0e8eb;
  display:flex;
  flex-direction:column;
  z-index:10;
  overflow-y:auto;
}
.brand{
  font-weight:950;
  font-size:40px;
  letter-spacing:-3px;
  text-decoration:none;
  color:#223c46;
}
.brand span{color:#ec916d}
.side-caption{
  font-size:10px;
  color:#97a2a7;
  margin:8px 0 33px;
}
.side-label{
  font-size:9px;
  letter-spacing:1.7px;
  color:#a2aeb2;
  margin:15px 12px;
}
.nav{
  display:flex;
  flex-direction:column;
  gap:8px;
  margin:0;
  padding:0;
  background:none;
  border:0;
  border-radius:0;
  overflow:visible;
}
.nav button,.side-button{
  width:100%;
  text-align:left;
  white-space:normal;
  border:0;
  border-radius:11px;
  background:transparent;
  color:#81919a;
  font-size:12px;
  font-weight:700;
  padding:15px 13px;
  transition:background .2s;
}
.nav button.active,.side-button.selected{
  background:#263e48;
  color:#fff;
}
.nav button:hover:not(.active),.side-button:hover{
  background:#edf3f4;
  color:#385560;
}
.side-button{margin-bottom:6px}
.side-bottom{margin-top:auto;padding-top:35px}
.side-note{
  background:#f4eee7;
  border-radius:14px;
  padding:17px;
  color:#8c7965;
}
.side-note b{font-size:11px}
.side-note p{font-size:10px;line-height:1.8}
.sidebar #adminButton{
  width:100%;
  margin-top:16px;
  background:none;
  border:1px solid #dce4e8;
  border-radius:10px;
  color:#87979f;
  font-size:11px;
  padding:11px;
}

/* 상단 */
.dashboard-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  margin-bottom:18px;
}
.dashboard-top small{
  font-size:9px;
  letter-spacing:1.8px;
  color:#9aa7ad;
}
.dashboard-top h2{
  font-size:25px;
  letter-spacing:-1px;
  margin:7px 0 0;
}
.connection-line{margin:0 0 18px}
.connection{
  font-size:10px;
  color:#87999f;
  background:transparent;
  padding:5px 0;
  overflow-wrap:anywhere;
}
.connection.error{
  background:#fff0e7;
  color:#a56948;
  padding:8px;
  border-radius:8px;
}
#reloadButton{
  font-size:10px;
  padding:6px 9px;
  background:#fff;
  color:#87979d;
  border:1px solid #dfe7eb;
}

/* 메인 소개 */
.hero{
  position:relative;
  display:grid;
  grid-template-columns:1.5fr 1fr;
  align-items:center;
  gap:20px;
  min-height:320px;
  background:#273e48;
  margin:0;
  padding:37px 42px;
  border:0;
  border-radius:24px;
  overflow:hidden;
}
.hero .eyebrow{
  font-size:9px;
  letter-spacing:2px;
  color:#aac6c4;
  margin-bottom:17px;
}
.hero h1{
  font-size:clamp(30px,3.5vw,46px);
  line-height:1.25;
  letter-spacing:-2px;
  color:#fff;
  margin:0;
}
.hero h1 span{color:#f3ba92}
.hero p{
  font-size:12px;
  color:#a9bdc6;
  line-height:1.9;
  margin:18px 0;
}
.hero-action{
  padding:12px 17px;
  background:#f0b38e;
  border:0;
  border-radius:9px;
  font-size:12px;
  font-weight:750;
  color:#594735;
}
.stats{
  display:flex;
  gap:16px;
  flex-wrap:wrap;
  font-size:9px;
  color:#a1b5bd;
  margin-top:23px;
}
.stats b{font-size:17px;margin-right:4px;color:#e6eeeb}
.hero-art{
  position:relative;
  display:grid;
  place-items:center;
  height:250px;
  min-height:250px;
  margin:0;
  transform:none;
}
.hero-art::before{
  content:"";
  position:absolute;
  inset:10px 20px;
  background:#3a5359;
  border-radius:50%;
  z-index:0;
}
.hero-art .mascot{
  position:relative;
  width:165px;
  height:220px;
  filter:none;
  mix-blend-mode:normal;
}
.hero-art .float{
  position:absolute;
  top:4px;
  right:0;
  border:0;
  border-radius:8px;
  background:#f2ede1;
  color:#7b7f69;
  font-size:9px;
  padding:9px 11px;
  transform:rotate(5deg);
}
.hero-art .float.bottom{
  top:auto;
  bottom:3px;
  left:0;
  right:auto;
  background:#e4d099;
  transform:rotate(-5deg);
}

/* 바로가기 카드 */
.quick-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:16px;
  margin:20px 0;
}
.quick-card{
  text-align:left;
  border:1px solid #dce6e8;
  border-radius:16px;
  padding:21px 24px;
  background:#e6eeec;
  color:#41615a;
}
.quick-card.help{
  background:#f1eae0;
  border-color:#e8dfd1;
  color:#88755b;
}
.quick-card span{
  display:block;
  font-size:8px;
  letter-spacing:1.5px;
  opacity:.7;
}
.quick-card b{
  display:block;
  font-size:17px;
  letter-spacing:-.5px;
  margin:11px 0 7px;
}
.quick-card p{font-size:11px;margin:0;opacity:.8}

/* 검색·콘텐츠 */
.filters{
  background:#fff;
  border:1px solid #e0e7ea;
  padding:22px;
  border-radius:16px;
  margin:0;
}
.filter-grid{gap:12px}
.filter-grid label{font-size:10px;color:#889ba4}
input,select,textarea{
  background:#fcfdfd;
  border:1px solid #dbe4e8;
  border-radius:9px;
  color:#405964;
  font-size:13px;
  padding:11px;
  width:100%;
}
input:focus,select:focus,textarea:focus{
  outline:2px solid #a4c5c8;
  border-color:#8fb6bb;
}
.section-title{margin:28px 0 18px;gap:12px}
.section-title h2{
  font-size:23px;
  letter-spacing:-.8px;
  color:#344f5c;
}
#resultCount{font-size:11px;color:#95a5ac;margin-top:6px}
.section-title>.badge{display:none}
.cards{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:16px;
}
.card{
  min-width:0;
  gap:14px;
  padding:23px;
  border:1px solid #dfe7eb;
  border-radius:17px;
  background:#fff;
  box-shadow:none;
  transition:transform .2s;
}
.card:hover{transform:translateY(-4px);border-color:#b2c9cf}
.badge{
  font-size:9px;
  padding:5px 8px;
  border-radius:5px;
  background:#eaf0f3;
  color:#7d95a3;
  align-self:flex-start;
}
.badge.green{background:#e8f0e8;color:#759171}
.badge.pink{background:#faeae1;color:#b88768}
.card h3{
  font-size:17px;
  line-height:1.55;
  letter-spacing:-.5px;
  word-break:keep-all;
  overflow-wrap:anywhere;
  color:#3b5561;
}
.card p{font-size:12px;line-height:1.8;color:#8b9ca3}
.card .bottom{
  padding-top:14px;
  border-top:1px solid #edf1f3;
  gap:10px;
}
.meta{font-size:10px;line-height:1.8;color:#9caab0}
.card .bottom .btn{
  padding:8px 10px;
  font-size:10px;
  background:#eef3f4;
  color:#7d99a0;
  border-radius:8px;
  flex-shrink:0;
}
.price{font-size:26px;font-weight:850;color:#47656d}
.card img,.placeholder{border-radius:10px;background:#edf2f3}
.features{color:#8a9c9f;font-size:12px;line-height:1.9}
.event-period{
  padding:9px 10px;
  background:#f5eee5;
  border-radius:7px;
  color:#a08868!important;
  font-size:10px!important;
}
.empty{
  background:#fff;
  border:1px dashed #cddde1;
  border-radius:15px;
  padding:40px 20px;
  color:#8a9ba3;
  font-size:12px;
  line-height:1.9;
}

/* 공통 버튼·관리자·팝업 */
.btn{
  background:#2f4d58;
  color:white;
  padding:11px 16px;
  border-radius:9px;
  font-size:12px;
  font-weight:700;
}
.btn.soft{background:#eaf0f1;color:#75959d}
.btn.white{background:#fff;color:#859da6;border:1px solid #dae5e9}
.btn.danger{background:#fff0e9;color:#b3826c}
.admin{
  margin-top:30px;
  background:#eaf0f2;
  border:1px solid #d6e2e7;
  border-radius:16px;
}
.admin-item{background:#fff;border:1px solid #e0e8eb;border-radius:10px}
dialog{
  background:#fff;
  border:1px solid #d7e3e7;
  border-radius:20px;
  color:#365562;
  max-width:calc(100vw - 28px);
  box-shadow:0 25px 90px #233e4935;
}
dialog::backdrop{background:#213a4780;backdrop-filter:blur(5px)}
.dialog-inner{padding:26px}
.checkout-summary,.receipt-table,.note{background:#edf3f5}
.close{background:#edf2f4;color:#8a9da5}
.demo-banner{background:#fcf0d9;color:#a38c60}
.total-line strong{color:#668d8e}
.toast{background:#304f58;border-radius:10px}
.footer{
  font-size:10px;
  color:#9baab0;
  margin-top:30px;
  padding:22px 0;
  border-top:1px solid #dfe7eb;
}
.footer-logo{width:100px;height:30px}
#localCodebar,.local-codebar{display:none!important}

/* 고객센터 */
.support-banner{
  background:#e8eeec;
  border:1px solid #dae5e0;
  border-radius:20px;
  padding:30px;
  margin-bottom:20px;
}
.support-banner small{
  font-size:9px;
  letter-spacing:2px;
  color:#8ca29b;
}
.support-banner h1{
  font-size:33px;
  color:#46665d;
  letter-spacing:-1.3px;
  margin:12px 0;
}
.support-banner p{font-size:13px;color:#82998f}
.faq-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
  margin-bottom:25px;
}
.faq-grid details{
  background:#fff;
  border:1px solid #e0e7e9;
  border-radius:12px;
  padding:17px;
}
.faq-grid summary{
  font-size:12px;
  cursor:pointer;
  color:#6c8792;
  line-height:1.6;
}
.faq-grid p{font-size:12px;line-height:1.8;color:#93a3a9}
.support-grid{
  display:grid;
  grid-template-columns:minmax(260px,.85fr) minmax(0,1.5fr);
  gap:22px;
  align-items:start;
}
.question-compose{
  background:#fff;
  padding:25px;
  border:1px solid #e0e7eb;
  border-radius:18px;
}
.question-compose>small{
  font-size:9px;
  letter-spacing:1.5px;
  color:#9aadb5;
}
.question-compose h2,.board-heading h2{
  font-size:22px;
  margin:10px 0;
  color:#4e6a76;
}
.public-note,.finder-note{
  font-size:11px;
  color:#a18c71;
  background:#f7f0e5;
  padding:13px;
  border-radius:8px;
  line-height:1.8;
}
#questionForm,#finderForm{display:grid;gap:9px}
#questionForm label,#finderForm label{
  font-size:11px;
  color:#8198a2;
  margin-top:6px;
}
#questionForm button,#finderForm button{margin-top:12px}
.board-heading{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
}
.board-heading p{font-size:11px;color:#9aadb5;margin:0}
#supportStatus{
  font-size:12px;
  color:#a08264;
  line-height:1.7;
  white-space:pre-line;
}
.question-card{
  background:#fff;
  border:1px solid #dfe7eb;
  border-radius:16px;
  padding:22px;
  margin-top:14px;
}
.question-top{
  display:flex;
  justify-content:space-between;
  gap:12px;
  flex-wrap:wrap;
  align-items:center;
}
.question-top small{font-size:10px;color:#9caeb5}
.q-tag{
  font-size:9px;
  background:#f5ebd9;
  color:#a79269;
  padding:5px 8px;
  border-radius:5px;
}
.q-tag.answered{background:#e6efe9;color:#819b88}
.question-card h3{
  font-size:16px;
  color:#55717c;
  margin:17px 0 10px;
  overflow-wrap:anywhere;
}
.preserve{
  white-space:pre-wrap;
  overflow-wrap:anywhere;
  font-size:12px;
  line-height:1.9;
  color:#8a9fa7;
}
.answer-box{
  background:#f0f5f4;
  padding:15px;
  border-radius:10px;
  margin-top:16px;
}
.answer-box b{font-size:11px;color:#7b9b91}
.answer-box p{margin-bottom:0}
.answer-form{
  border-top:1px solid #e8eff1;
  padding-top:15px;
  margin-top:16px;
}
.answer-form label{font-size:11px;color:#91a6af}
.answer-form textarea{margin-top:8px}
.q-actions{display:flex;gap:10px;margin-top:10px}
.finder-dialog{width:480px}
.finder-dialog h2{font-size:22px}

/* 로딩 */
.opening{
  min-height:100svh;
  display:grid;
  place-content:center;
  padding:25px;
  text-align:center;
}
.opening-logo{font-size:44px;letter-spacing:-3px;font-weight:900}
.opening p{
  font-size:13px;
  color:#8ca0a8;
  line-height:1.9;
  white-space:pre-line;
}
.opening button{
  padding:12px 20px;
  border:0;
  border-radius:10px;
  background:#2e505c;
  color:white;
}

/* 반응형 */
@media(max-width:1200px){
  .dashboard-main{padding:25px!important;margin-left:215px!important}
  .sidebar{width:215px;padding:25px 17px}
  .cards{grid-template-columns:repeat(2,minmax(0,1fr))}
  .hero{padding:30px}
  .support-grid{grid-template-columns:1fr}
  .faq-grid{grid-template-columns:1fr}
}
@media(max-width:760px){
  .sidebar{
    position:static;
    width:100%;
    padding:18px;
    display:block;
    border-right:0;
    border-bottom:1px solid #dfe7ea;
  }
  .brand{font-size:31px}
  .side-caption,.side-label,.side-note{display:none}
  .nav{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:7px;
    margin-top:15px;
  }
  .nav button{font-size:11px;padding:12px;background:#edf2f4}
  .side-button{
    width:auto;
    padding:10px 12px;
    margin:10px 4px 0 0;
    font-size:11px;
  }
  .side-bottom{padding:0;display:inline}
  .sidebar #adminButton{
    width:auto;
    margin-top:10px;
    padding:9px 12px;
    font-size:10px;
  }
  .dashboard-main{margin-left:0!important;padding:22px 18px!important}
  .dashboard-top h2{font-size:23px}
  .dashboard-top>.btn{font-size:10px;padding:9px 12px}
  .hero{grid-template-columns:1fr;padding:27px;gap:10px}
  .hero h1{font-size:36px}
  .hero-art{
    height:210px;
    min-height:210px;
    width:230px;
    max-width:100%;
    margin:auto;
  }
  .hero-art .mascot{width:140px;height:185px}
  .hero-art .float{font-size:8px}
  .quick-grid{gap:10px}
  .quick-card{padding:17px}
  .quick-card b{font-size:14px;line-height:1.5}
  .quick-card p{font-size:10px;line-height:1.7}
  .filters{padding:18px}
  .filter-grid{grid-template-columns:1fr 1fr;gap:10px}
  .filter-grid>div:last-child{grid-column:1/-1}
  .cards{grid-template-columns:1fr}
  .card{padding:23px}
  .support-banner{padding:25px}
  .support-banner h1{font-size:28px}
  .question-compose{padding:22px}
  .question-card{padding:20px}
  .dialog-inner{padding:22px}
}
@media(prefers-reduced-motion:reduce){
  *{
    scroll-behavior:auto!important;
    transition:none!important;
    animation:none!important;
  }
}
</style>
</head>

<body>
<main class="opening">
  <div class="opening-logo">GY:ON</div>
  <p id="loadingMessage" role="status">
    나의 기회 보드를 불러오는 중…
  </p>
  <button id="retryButton" hidden type="button">
    다시 불러오기
  </button>
</main>

<script>
(() => {
  "use strict";

  const revision = "e85117637a6c933f4d15e62887ac2690277ab7ae";
  const designCSS = document.getElementById("newDesign").textContent;
  let loading = false;

  // ========================================
  // 지역 선택·특별할인 기간
  // ========================================
  function installFeatures() {
    function validDate(value) {
      if (!/^\d{4}-\d{2}-\d{2}$/.test(value || "")) return false;
      const date = new Date(value + "T00:00:00Z");
      return !Number.isNaN(date.getTime()) &&
        date.toISOString().slice(0,10) === value;
    }

    function period(item) {
      return validDate(item.startDate) && validDate(item.endDate)
        ? "할인 기간: " +
          item.startDate.replaceAll("-", ".") +
          " ~ " +
          item.endDate.replaceAll("-", ".")
        : "할인 기간 미설정";
    }

    function selectField(id, options, selected, placeholder) {
      const input = $(id);
      const select = document.createElement("select");
      select.id = id;
      select.name = input.name;
      select.required = true;

      select.innerHTML =
        '<option value="">' + placeholder + '</option>' +
        options.map(value =>
          '<option value="' + escapeHTML(value) + '">' +
          escapeHTML(value) + '</option>'
        ).join("");

      select.value = options.includes(selected) ? selected : "";
      input.replaceWith(select);
      return select;
    }

    const originalEditor = openEditor;

    openEditor = function(index = null) {
      if (!admin || busy) return;
      originalEditor(index);
      if (!editing) return;

      const item = editing.original || {};

      if (["mainData", "eventData"].includes(editing.key)) {
        const map = regionMap();

        const city = selectField(
          "f-region",
          Object.keys(map),
          item.region || "",
          "시 / 군 선택"
        );

        const updateDong = selected => {
          const dong = selectField(
            "f-dong",
            map[city.value] || [],
            selected || "",
            "동 / 면 선택"
          );
          dong.disabled = !city.value;
        };

        updateDong(item.dong);
        city.addEventListener("change", () => updateDong(""));
      }

      if (editing.key === "eventData") {
        $("fields").insertAdjacentHTML(
          "beforeend",
          field("startDate", "할인 시작일", item.startDate || "", "date") +
          field("endDate", "할인 종료일", item.endDate || "", "date") +
          '<p class="full muted">' +
          '시작일과 종료일을 포함한 할인 기간이에요.' +
          '</p>'
        );

        const start = $("f-startDate");
        const end = $("f-endDate");
        start.required = end.required = true;
        end.min = start.value;

        start.addEventListener("input", () => {
          end.min = start.value;
        });
      }
    };

    $("editForm").addEventListener("submit", event => {
      if (!admin || busy || !editing) return;
      let message = "";

      if (["mainData", "eventData"].includes(editing.key)) {
        if (
          !(regionMap()[$("f-region").value] || [])
            .includes($("f-dong").value)
        ) {
          message = "등록된 시 / 군과 해당 동 / 면을 선택해 주세요.";
        }
      }

      if (!message && editing.key === "eventData") {
        const start = $("f-startDate").value;
        const end = $("f-endDate").value;

        if (!validDate(start) || !validDate(end)) {
          message = "시작일과 종료일을 모두 선택해 주세요.";
        } else if (end < start) {
          message = "종료일은 시작일과 같거나 이후여야 해요.";
        }
      }

      if (message) {
        event.preventDefault();
        event.stopImmediatePropagation();
        $("editError").textContent = message;
        $("editError").hidden = false;
      }
    }, true);

    const originalCards = renderCards;

    renderCards = function() {
      originalCards();
      if (tab !== "eventData") return;

      $("cards").querySelectorAll(".card").forEach(card => {
        const button = card.querySelector("[data-detail]");
        const item = button &&
          db.eventData[Number(button.dataset.detail)];

        if (!item) return;

        const line = document.createElement("p");
        line.className = "event-period";
        line.textContent = period(item);

        const bottom = card.querySelector(".bottom");
        if (bottom) bottom.before(line);
        else card.appendChild(line);
      });
    };

    const originalDetail = detail;

    detail = function(index) {
      originalDetail(index);
      if (tab === "eventData" && db[tab][index]) {
        $("detailMeta").textContent += " · " + period(db[tab][index]);
      }
    };
  }

  // ========================================
  // Q&A·고객센터·맞춤 검색
  // ========================================
  function installSupport() {
    // 기존 데이터는 유지하고 Q&A 배열만 추가합니다.
    const originalApi = api;

    api = async function(method, data) {
      const result = await originalApi(method, data);
      if (!Array.isArray(result.qnaData)) result.qnaData = [];
      return result;
    };

    let pendingQuestion = null;
    let supportBusy = false;
    const questionForm = $("questionForm");

    function showView(support) {
      $("exploreView").hidden = support;
      $("supportView").hidden = !support;
      $("helpNav").classList.toggle("selected", support);
      $("pageName").textContent = support
        ? "고객센터 · Q&A"
        : "나의 기회 보드";

      if (support) renderSupport();
    }

    function renderSupport() {
      const items = Array.isArray(db.qnaData) ? db.qnaData : [];
      $("qnaCount").textContent = items.length + "개의 질문";

      $("qnaList").innerHTML = items.length
        ? items.slice().reverse().map(item => `
          <article class="question-card">
            <div class="question-top">
              <span class="q-tag ${item.answer ? "answered" : ""}">
                ${item.answer ? "답변 완료" : "답변 대기"}
              </span>
              <small>
                ${escapeHTML(
                  item.createdAt
                    ? String(item.createdAt).slice(0,10)
                    : ""
                )}
                · ${escapeHTML(item.nickname || "방문자")}
              </small>
            </div>

            <h3>${escapeHTML(item.title)}</h3>
            <p class="preserve">${escapeHTML(item.body)}</p>

            ${item.answer ? `
              <div class="answer-box">
                <b>GY:ON 답변</b>
                <p class="preserve">${escapeHTML(item.answer)}</p>
              </div>
            ` : ""}

            ${admin ? `
              <form
                class="answer-form"
                data-qid="${escapeHTML(item.id)}"
              >
                <label>
                  관리자 답변
                  <textarea
                    name="answer"
                    rows="3"
                    maxlength="2000"
                    required
                  >${escapeHTML(item.answer || "")}</textarea>
                </label>
                <div class="q-actions">
                  <button type="submit" class="btn">
                    답변 저장
                  </button>
                  <button
                    type="button"
                    class="btn danger"
                    data-delete-question="${escapeHTML(item.id)}"
                  >질문 삭제</button>
                </div>
              </form>
            ` : ""}
          </article>
        `).join("")
        : `
          <div class="empty">
            아직 등록된 질문이 없어요.<br>
            궁금한 내용을 첫 질문으로 남겨 봐.
          </div>
        `;
    }

    function lockSupport(value) {
      supportBusy = value;
      setBusy(value);

      document.querySelectorAll(
        "#supportView button," +
        "#supportView input," +
        "#supportView textarea"
      ).forEach(element => {
        element.disabled = value;
      });
    }

    const originalRenderAll = renderAll;

    renderAll = function() {
      originalRenderAll();
      renderSupport();
    };

    // 질문 등록
    questionForm.addEventListener("submit", async event => {
      event.preventDefault();
      if (busy || supportBusy) return;

      const title = $("qTitle").value.trim();
      const body = $("qBody").value.trim();
      const nickname = $("qNickname").value.trim() || "방문자";

      if (
        !title || !body ||
        title.length > 100 ||
        body.length > 2000 ||
        nickname.length > 20
      ) {
        $("supportStatus").textContent =
          "제목과 내용을 입력하고 글자 수를 확인해 주세요.";
        return;
      }

      if (!ready) {
        $("supportStatus").textContent =
          "서버 연결 후 등록할 수 있어요. ‘새로고침’을 눌러 주세요.";
        return;
      }

      // 재시도 시 같은 ID를 사용해 중복 등록을 줄입니다.
      if (
        !pendingQuestion ||
        pendingQuestion.title !== title ||
        pendingQuestion.body !== body ||
        pendingQuestion.nickname !== nickname
      ) {
        pendingQuestion = {
          id: crypto.randomUUID(),
          title,
          body,
          nickname,
          createdAt: new Date().toISOString(),
          answer: ""
        };
      }

      lockSupport(true);
      $("supportStatus").textContent = "질문을 저장하는 중…";

      try {
        await commit("qnaData", null, pendingQuestion);

        if (
          !(db.qnaData || []).some(
            item => item.id === pendingQuestion.id
          )
        ) {
          throw new Error("저장 결과를 확인하지 못했어요.");
        }

        pendingQuestion = null;
        questionForm.reset();

        $("supportStatus").textContent =
          "질문을 등록했어요. 아래 목록에서 확인해 주세요.";
      } catch (error) {
        $("supportStatus").textContent =
          "등록 완료를 확인하지 못했어요. " +
          error.message +
          " 입력 내용은 유지돼요.";
      } finally {
        lockSupport(false);
      }
    });

    // 관리자 답변
    $("qnaList").addEventListener("submit", async event => {
      const form = event.target.closest(".answer-form");
      if (!form) return;

      event.preventDefault();
      if (!admin || busy || supportBusy) return;

      const original = (db.qnaData || []).find(
        item => String(item.id) === form.dataset.qid
      );

      const answer = form.querySelector("textarea").value.trim();

      if (!original || !answer || answer.length > 2000) return;

      lockSupport(true);
      $("supportStatus").textContent = "답변을 저장하는 중…";

      try {
        await commit(
          "qnaData",
          clone(original),
          {
            ...clone(original),
            answer,
            answeredAt: new Date().toISOString()
          }
        );

        $("supportStatus").textContent = "답변을 저장했어요.";
      } catch (error) {
        $("supportStatus").textContent =
          "답변 저장 실패: " + error.message;
      } finally {
        lockSupport(false);
      }
    });

    // 관리자 질문 삭제
    $("qnaList").addEventListener("click", async event => {
      const button = event.target.closest("[data-delete-question]");

      if (!button || !admin || busy || supportBusy) return;

      const item = (db.qnaData || []).find(
        entry =>
          String(entry.id) === button.dataset.deleteQuestion
      );

      if (!item || !confirm("이 질문과 답변을 삭제할까요?")) return;

      lockSupport(true);

      try {
        await commit("qnaData", clone(item), null);
        $("supportStatus").textContent = "질문을 삭제했어요.";
      } catch (error) {
        $("supportStatus").textContent =
          "삭제 실패: " + error.message;
      } finally {
        lockSupport(false);
      }
    });

    document.querySelectorAll("[data-help]").forEach(button => {
      button.addEventListener("click", () => showView(true));
    });

    $("navigation").addEventListener("click", () => {
      showView(false);
    });

    $("supportReload").addEventListener("click", async () => {
      if (busy) return;
      await load();

      $("supportStatus").textContent = ready
        ? "최신 목록을 불러왔어요."
        : "연결하지 못했어요. 연결 상태를 확인해 주세요.";
    });

    // 로그인 상태에 따라 답변 입력창 표시
    const originalLogin = $("loginForm").onsubmit;

    $("loginForm").onsubmit = function(event) {
      originalLogin.call(this, event);
      renderSupport();
    };

    const originalLogout = $("logoutButton").onclick;

    $("logoutButton").onclick = function(event) {
      originalLogout.call(this, event);
      renderSupport();
    };

    // API 없는 조건 검색
    function openFinder() {
      $("finderRegion").innerHTML =
        '<option value="">전체 지역</option>' +
        Object.keys(regionMap()).map(name =>
          "<option>" + escapeHTML(name) + "</option>"
        ).join("");

      $("finderDialog").showModal();
    }

    document.querySelectorAll("[data-finder]").forEach(button => {
      button.addEventListener("click", openFinder);
    });

    $("finderClose").addEventListener("click", () => {
      $("finderDialog").close();
    });

    $("finderForm").addEventListener("submit", event => {
      event.preventDefault();

      const key = $("finderType").value;

      document.querySelector(
        '#navigation [data-tab="' + key + '"]'
      ).click();

      $("region").value = $("finderRegion").value;
      $("dong").value = "";
      fillDongs();

      $("age").value = $("finderAge").value;
      $("category").value = "";
      $("search").value = $("finderKeyword").value.trim();

      renderCards();
      $("finderDialog").close();
      $("cards").scrollIntoView({ block: "start" });

      toast("입력한 지역·나이·키워드 조건으로 찾았어요.");
    });

    renderSupport();
  }

  // ========================================
  // 기존 사이트 불러오기
  // ========================================
  async function request(url, json = false) {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), 15000);

    try {
      const response = await fetch(url, {
        signal: controller.signal,
        cache: "no-store",
        credentials: "omit"
      });

      if (!response.ok) {
        throw new Error("서버 응답 오류: HTTP " + response.status);
      }

      return json
        ? await response.json()
        : await response.text();
    } finally {
      clearTimeout(timer);
    }
  }

  function parse(html) {
    const page = new DOMParser().parseFromString(html, "text/html");

    const required = [
      ".top", ".hero", ".hero-art", ".section-title",
      "#stats", "#navigation", "#filters", "#cards",
      "#search", "#region", "#dong", "#age", "#category",
      "#adminButton", "#connection", "#editForm", "#fields",
      "#gyonMascot", "#checkoutForm"
    ];

    if (required.some(selector => !page.querySelector(selector))) {
      throw new Error("전체 사이트 코드를 받지 못했어요.");
    }

    return page;
  }

  async function loadSource() {
    try {
      return parse(
        await request(
          "https://raw.githubusercontent.com/hyun4115/gyon/" +
          revision + "/index.html"
        )
      );
    } catch (error) {
      const result = await request(
        "https://api.github.com/repos/hyun4115/gyon/contents/index.html?ref=" +
        revision,
        true
      );

      if (
        result.encoding !== "base64" ||
        typeof result.content !== "string"
      ) {
        throw new Error("사이트를 불러오지 못했어요.");
      }

      const bytes = Uint8Array.from(
        atob(result.content.replace(/\s/g, "")),
        char => char.charCodeAt(0)
      );

      return parse(new TextDecoder().decode(bytes));
    }
  }

  async function start() {
    if (loading) return;
    loading = true;

    const message = document.getElementById("loadingMessage");
    const retry = document.getElementById("retryButton");

    retry.hidden = true;
    message.textContent = "나의 기회 보드를 불러오는 중…";

    let html;

    try {
      html = build(await loadSource());
    } catch (error) {
      loading = false;
      retry.hidden = false;

      message.textContent =
        "사이트를 불러오지 못했어요.\n" +
        "인터넷 연결을 확인하고 다시 눌러 주세요.\n\n" +
        (
          error.name === "AbortError"
            ? "연결 시간이 초과됐어요."
            : error.message
        );

      return;
    }

    document.open();
    document.write(html);
    document.close();
  }

  document.getElementById("retryButton").addEventListener(
    "click",
    start
  );

  start();
})();
</script>
</body>
</html>
