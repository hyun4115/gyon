<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f8f5ee">
<title>GY:ON — 오늘의 발견, 내일의 가능성</title>

<style id="newDesign">
/* 기본 설정 */
*{box-sizing:border-box}
:root{
  --ink:#202e3b;
  --muted:#758078;
  --purple:#203b39;
  --light:#f0f2e8;
  --paper:#f8f5ee;
  --orange:#ec7048;
  --line:#deded2;
}
html{scroll-behavior:smooth;scroll-padding-top:28px}
body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:Pretendard,"Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit}
button{cursor:pointer;touch-action:manipulation}
a{color:inherit}
[hidden]{display:none!important}
button:focus-visible,a:focus-visible{
  outline:3px solid #ec7048;
  outline-offset:4px;
}
.wrap{max-width:1280px;padding:0 42px;margin:auto}

/* 헤더 */
.header{background:#f8f5ee;border-bottom:1px solid var(--line)}
.top{height:92px;gap:20px}
.logo{width:145px;height:42px}
.tagline{font-size:9px;color:#7d8178;letter-spacing:1.2px}
.header-message{margin-left:auto;font-size:12px;color:#72796f}
.header-message::before{
  content:"●";
  color:#ec7048;
  font-size:9px;
  margin-right:9px;
}
#adminButton{
  background:transparent;
  border:1px solid #cdd0c5;
  color:#3d5149;
  border-radius:100px;
  padding:11px 17px;
  font-size:12px;
}

/* 첫 화면 */
.hero{
  position:relative;
  display:grid;
  grid-template-columns:1.4fr 1fr;
  align-items:center;
  gap:30px;
  background:transparent;
  padding:54px 0 38px;
  margin:0;
  min-height:460px;
  border:0;
  border-radius:0;
  overflow:visible;
}
.hero-copy{min-width:0}
.hero .eyebrow{
  display:inline-flex;
  align-items:center;
  gap:9px;
  background:#eeeadd;
  color:#69745d;
  border:1px solid #e1ddcf;
  border-radius:100px;
  padding:8px 12px;
  font-size:10px;
  letter-spacing:1.2px;
  margin-bottom:22px;
}
.hero .eyebrow::before{
  content:"";
  width:6px;
  height:6px;
  background:#ec7048;
  border-radius:50%;
}
.hero h1{
  margin:0;
  font-size:clamp(42px,5vw,67px);
  font-weight:900;
  line-height:1.18;
  letter-spacing:-3.8px;
  color:#202e3b;
  word-break:keep-all;
}
.hero h1 span{color:#e56b45}
.hero p{
  margin:24px 0 0;
  color:#778074;
  font-size:14px;
  line-height:1.9;
  word-break:keep-all;
}
.hero-actions{
  display:flex;
  align-items:center;
  flex-wrap:wrap;
  gap:18px;
  margin-top:25px;
}
.hero-cta{
  display:inline-flex;
  align-items:center;
  gap:27px;
  background:#203b39;
  color:#fff;
  border:0;
  border-radius:100px;
  padding:15px 22px;
  font-size:13px;
  font-weight:700;
}
.hero-cta:hover{background:#31554e}
.hero-cta span{font-size:19px}
.hero-small{font-size:11px;color:#899080}
.stats{
  display:flex;
  gap:0;
  flex-wrap:wrap;
  margin-top:28px;
  color:#7b8378;
  font-size:10px;
}
.stats>span{padding:0 17px;border-left:1px solid #d6d9ce}
.stats>span:first-child{padding-left:0;border:0}
.stats b{color:#35483c;font-size:20px;margin-right:6px}

/* 캐릭터 영역 */
.hero-art{
  position:relative;
  display:grid;
  place-items:center;
  height:370px;
  min-height:370px;
  margin:0;
  transform:none;
  background:#e7eadc;
  border:1px solid #dce0d0;
  border-radius:48% 48% 22px 22px;
  isolation:isolate;
  overflow:visible;
}
.hero-art::before{
  content:"";
  position:absolute;
  width:255px;
  height:255px;
  border:1px solid #bcc5ad;
  border-radius:50%;
  z-index:-1;
}
.hero-art::after{
  content:"✳";
  position:absolute;
  top:18px;
  right:5px;
  font-size:73px;
  line-height:1;
  color:#eb764d;
  transform:rotate(12deg);
  z-index:-1;
}
.hero-art .mascot{
  width:222px;
  height:282px;
  max-width:85%;
  margin:15px 0 0;
  filter:none;
  mix-blend-mode:normal;
}
.hero-art .float{
  position:absolute;
  top:30px;
  left:-25px;
  right:auto;
  background:#fffdf6;
  color:#43543d;
  padding:12px 15px;
  border:1px solid #e5e2d4;
  border-radius:12px;
  box-shadow:0 9px 25px #253b3210;
  transform:rotate(-7deg);
  font-size:11px;
  font-weight:700;
}
.hero-art .float.bottom{
  top:auto;
  left:auto;
  right:-10px;
  bottom:30px;
  background:#f2d77e;
  color:#68571e;
  border-color:#e9cf79;
  transform:rotate(7deg);
}
.art-label{
  position:absolute;
  bottom:14px;
  font-size:9px;
  letter-spacing:2px;
  color:#8b947c;
}

/* 소개 띠 */
.discovery-bar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
  padding:16px 20px;
  background:#263b39;
  color:#f5f6e9;
  border-radius:12px;
  margin:0 0 30px;
  font-size:12px;
}
.discovery-bar b{color:#efd183;letter-spacing:1px;font-size:10px}
.discovery-bar span:last-child{color:#c0cbb7;font-size:11px}

/* 카드형 메뉴 */
.nav{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:12px;
  padding:0;
  margin:0 0 22px;
  background:transparent;
  border:0;
  border-radius:0;
  overflow:visible;
}
.nav button{
  display:flex;
  align-items:center;
  gap:13px;
  min-height:91px;
  padding:20px;
  background:#fffdf7;
  color:#64705f;
  border:1px solid #dfdfd2;
  border-radius:16px;
  font-size:13px;
  font-weight:750;
  text-align:left;
  transition:transform .2s,background .2s;
}
.nav button::before{
  content:attr(data-icon);
  display:grid;
  place-items:center;
  flex-shrink:0;
  width:38px;
  height:38px;
  background:#f0eee2;
  border-radius:12px;
  color:#768465;
  font-size:20px;
}
.nav button::after{
  content:"↗";
  margin-left:auto;
  font-size:19px;
  font-weight:400;
  color:#a6ae97;
}
.nav button.active{
  background:#203b39;
  color:#fff;
  border-color:#203b39;
}
.nav button.active::before{background:#3c5548;color:#f0d688}
.nav button.active::after{color:#f0d688}
.nav button:hover{transform:translateY(-2px)}

/* 검색 */
.filters{
  background:#edeedf;
  border:1px solid #e0e2d2;
  border-radius:18px;
  margin:0;
  padding:24px 27px;
  scroll-margin-top:24px;
}
.search-heading{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  margin-bottom:17px;
}
.search-heading small{
  display:block;
  color:#8a947b;
  font-size:9px;
  letter-spacing:1.6px;
  margin-bottom:6px;
}
.search-heading h2{
  margin:0;
  color:#35483a;
  font-size:20px;
  letter-spacing:-.7px;
}
.reset-search{
  background:none;
  border:0;
  color:#75836a;
  font-size:11px;
  padding:8px;
}
.filter-grid{
  display:grid;
  grid-template-columns:1.2fr 1fr 1fr .7fr;
  gap:12px;
}
.filter-grid .keyword-field{
  grid-column:1/-1;
  grid-row:1;
  position:relative;
  margin-bottom:4px;
}
.keyword-field label{
  position:absolute;
  clip-path:inset(50%);
  width:1px;
  height:1px;
  overflow:hidden;
}
.keyword-field::before{
  content:"⌕";
  position:absolute;
  left:17px;
  top:7px;
  font-size:29px;
  color:#849274;
  pointer-events:none;
}
input,select,textarea{
  background:#fffef9;
  border:1px solid #d9decf;
  border-radius:10px;
  color:#35473c;
  font-size:13px;
}
input:focus,select:focus,textarea:focus{
  border-color:#9aab7e;
  outline:2px solid #acba9428;
}
#search{
  height:52px;
  padding:13px 17px 13px 48px;
  background:#fffef9;
  border:1px solid #d9decf;
  border-radius:12px;
  font-size:13px;
}
#search::placeholder{color:#969c8d}
.filter-grid label{font-size:10px;color:#7b876e;margin-bottom:6px}
.filter-grid select,.filter-grid input:not(#search){
  min-height:43px;
  padding:10px 12px;
}

/* 연결 안내 */
.connection-line{margin-top:13px;gap:10px}
.connection{
  background:transparent;
  color:#829077;
  font-size:10px;
  padding:6px 0;
  overflow-wrap:anywhere;
}
.connection.error{
  color:#a04d36;
  background:#f9e8dc;
  border-radius:6px;
  padding:7px 10px;
}
#reloadButton{
  font-size:10px;
  padding:6px 9px;
  background:transparent;
  color:#819071;
  border-color:#d9dfcc;
}

/* 콘텐츠 제목 */
.section-title{margin:33px 0 21px;align-items:flex-end;gap:16px}
.section-kicker{
  font-size:9px;
  letter-spacing:1.7px;
  color:#ac825f;
  margin-bottom:8px;
}
.section-title h2{
  color:#273d35;
  font-size:28px;
  letter-spacing:-1.3px;
  word-break:keep-all;
}
#resultCount{font-size:11px;color:#8a937f;margin-top:7px}
.section-title>.badge{
  background:transparent;
  font-size:9px;
  color:#97a086;
  letter-spacing:1px;
  padding:0;
}

/* 콘텐츠 카드 */
.cards{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:18px;
}
.card{
  position:relative;
  min-width:0;
  gap:16px;
  padding:25px;
  border:1px solid #dfdfd3;
  background:#fffef8;
  border-radius:18px;
  box-shadow:0 3px 0 #dfdfd32c;
  transition:transform .2s,box-shadow .2s;
}
.card:hover{
  transform:translateY(-5px);
  box-shadow:0 15px 30px #3f513810;
  border-color:#c6d0b8;
}
.badge{
  align-self:flex-start;
  padding:6px 9px;
  border-radius:6px;
  background:#eeeadd;
  color:#8d7b53;
  font-size:10px;
  font-weight:700;
}
.badge.green{background:#eaf0df;color:#72865c}
.badge.pink{background:#fae6dc;color:#b56b4e}
.card h3{
  color:#314638;
  font-size:18px;
  line-height:1.5;
  letter-spacing:-.6px;
  word-break:keep-all;
  overflow-wrap:anywhere;
}
.card p{color:#849079;font-size:12px;line-height:1.85}
.card .bottom{gap:12px;padding-top:17px;border-top:1px solid #eeeee2}
.meta{font-size:10px;color:#939c86;line-height:1.8}
.card .bottom .btn{
  padding:9px 11px;
  border-radius:100px;
  background:#f0f1e5;
  border:1px solid #e2e6d5;
  color:#6b8158;
  font-size:10px;
  flex-shrink:0;
}
.card img,.placeholder{background:#eff0e4;border-radius:12px}
.price{font-size:28px;font-weight:850;letter-spacing:-1px;color:#344e3c}
.features{font-size:12px;color:#7a896b;line-height:2}
.empty{
  padding:65px 25px;
  background:#fffdf7;
  border:1px dashed #cbd3be;
  border-radius:18px;
  color:#8d987f;
  font-size:13px;
  line-height:2;
}
.event-period{
  padding:10px 12px;
  border-radius:9px;
  background:#f5eddb;
  color:#987444!important;
  font-size:11px!important;
  font-weight:700;
  overflow-wrap:anywhere;
}

/* 하단 배너 */
.brand-note{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:30px;
  margin:38px 0 0;
  padding:38px;
  background:#f1d888;
  border:1px solid #e8d080;
  border-radius:21px;
}
.brand-note small{font-size:9px;letter-spacing:1.5px;color:#a18b45}
.brand-note h3{
  font-size:30px;
  line-height:1.3;
  letter-spacing:-1.4px;
  color:#4a4a31;
  margin:13px 0 10px;
}
.brand-note p{font-size:12px;color:#8d814f;margin:0}
.note-action{
  display:grid;
  place-items:center;
  width:64px;
  height:64px;
  flex-shrink:0;
  background:#4b5536;
  border:0;
  border-radius:50%;
  font-size:32px;
  color:#f9edbd;
}
.note-action:hover{background:#657047}
.footer{
  margin-top:30px;
  padding:28px 0 35px;
  border-top:1px solid #dfdfcf;
  color:#99a08c;
  gap:15px;
  font-size:10px;
}
.footer-logo{width:100px;height:30px}

/* 관리자·상세·결제 */
.btn{
  background:#29443b;
  color:#fff;
  border-radius:10px;
  padding:11px 17px;
  font-size:13px;
  font-weight:700;
}
.btn.soft{background:#edf1e3;color:#71845a}
.btn.white{background:#fffdf6;color:#768565;border:1px solid #dce3d0}
.btn.danger{background:#fcebe3;color:#b66e57}
.admin{background:#eef0e2;border:1px solid #dce2cd;border-radius:18px}
.admin-item{background:#fffef7;border:1px solid #e1e5d5;border-radius:12px}
dialog{
  color:#354a3b;
  background:#fffdf6;
  border:1px solid #e0e4d4;
  border-radius:22px;
  box-shadow:0 25px 90px #1e352f30;
}
dialog::backdrop{background:#20362e85;backdrop-filter:blur(6px)}
.dialog-inner{padding:28px}
.dialog-head h2{font-size:23px;color:#374e3c}
.close{background:#eff2e4;color:#839170}
.checkout-summary,.receipt-table,.note{background:#f1f3e6}
.demo-banner{background:#fff0d0;color:#9d8146;font-size:12px;line-height:1.8}
.total-line strong{color:#5c7847}
.toast{background:#2d483a;border-radius:12px}
#localCodebar,.local-codebar{display:none!important}

/* 로딩 */
.opening{
  min-height:100svh;
  display:grid;
  place-content:center;
  padding:25px;
  text-align:center;
}
.opening-logo{font-size:48px;font-weight:900;letter-spacing:-3px}
.opening-logo span{color:#ec7048}
.opening p{
  max-width:440px;
  white-space:pre-line;
  font-size:13px;
  color:#7d8972;
  line-height:1.9;
}
.opening button{
  border:0;
  border-radius:100px;
  padding:13px 20px;
  background:#29443b;
  color:white;
}

/* 태블릿 */
@media(max-width:1000px){
  .wrap{padding:0 28px}
  .hero{grid-template-columns:1.3fr 1fr;gap:30px}
  .hero h1{font-size:49px;letter-spacing:-3px}
  .hero-art{height:320px;min-height:320px}
  .hero-art .mascot{width:190px;height:250px}
  .hero-art::before{width:220px;height:220px}
  .hero-art .float{left:-15px;font-size:10px}
  .nav button{padding:16px 13px;gap:9px;font-size:12px}
  .nav button::before{width:31px;height:31px;font-size:18px}
  .cards{grid-template-columns:repeat(2,minmax(0,1fr))}
  .header-message{display:none}
  .discovery-bar span:last-child{display:none}
}

/* 모바일 */
@media(max-width:640px){
  .wrap{padding:0 18px}
  .top{height:77px}
  .logo{width:121px;height:36px}
  .tagline{display:none}
  #adminButton{font-size:10px;padding:9px 12px}
  .hero{display:block;padding:34px 0 25px;min-height:0}
  .hero .eyebrow{font-size:8px;margin-bottom:20px}
  .hero h1{font-size:clamp(38px,10.5vw,58px);letter-spacing:-2.7px}
  .hero p{font-size:12px;margin-top:20px}
  .hero-cta{padding:13px 19px;font-size:12px}
  .hero-small{font-size:10px}
  .stats{margin-top:24px}
  .stats>span{padding:0 12px}
  .stats b{font-size:18px}
  .hero-art{
    height:275px;
    min-height:275px;
    width:85%;
    max-width:330px;
    margin:32px auto 8px;
    border-radius:46% 46% 18px 18px;
  }
  .hero-art .mascot{width:173px;height:224px;margin-top:8px}
  .hero-art::before{width:195px;height:195px}
  .hero-art::after{font-size:56px;right:0;top:15px}
  .hero-art .float{top:22px;left:-18px;font-size:9px;padding:10px 12px}
  .hero-art .float.bottom{bottom:25px;right:-17px;top:auto;left:auto}
  .art-label{font-size:7px;bottom:11px}
  .discovery-bar{font-size:10px;padding:13px 14px;gap:12px;margin-bottom:22px}
  .discovery-bar b{font-size:8px;white-space:nowrap}
  .nav{grid-template-columns:1fr 1fr;gap:9px;margin-bottom:18px}
  .nav button{min-height:72px;padding:14px;font-size:12px}
  .nav button::after{font-size:16px}
  .filters{padding:21px 18px;border-radius:15px}
  .search-heading h2{font-size:17px}
  .search-heading small{font-size:8px}
  .reset-search{font-size:10px}
  .filter-grid{grid-template-columns:1fr 1fr;gap:10px}
  .filter-grid>div:last-child{grid-column:auto}
  .filter-grid .keyword-field{grid-column:1/-1}
  .filter-grid select,.filter-grid input:not(#search){font-size:12px;padding:10px}
  #search{font-size:12px}
  .section-title{margin:29px 0 18px}
  .section-title h2{font-size:24px}
  .section-title>.badge{display:none}
  .cards{grid-template-columns:1fr;gap:14px}
  .card{padding:24px}
  .card p{font-size:13px}
  .meta,.card .bottom .btn{font-size:11px}
  .brand-note{padding:27px 24px;gap:15px;margin-top:28px}
  .brand-note h3{font-size:25px}
  .brand-note small{font-size:7px}
  .brand-note p{font-size:10px}
  .note-action{width:46px;height:46px;font-size:26px}
  .footer{font-size:9px}
  .dialog-inner{padding:22px}
}

@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{
    animation:none!important;
    transition:none!important;
  }
}
</style>
</head>

<body>
<main class="opening">
  <div class="opening-logo">GY<span>:ON</span></div>
  <p id="loadingMessage" role="status">
    오늘의 새로운 기회를 불러오는 중…
  </p>
  <button id="retryButton" hidden type="button">
    다시 불러오기
  </button>
</main>

<script>
(() => {
  "use strict";

  // 기존 기능이 들어 있는 고정 버전
  const revision = "e85117637a6c933f4d15e62887ac2690277ab7ae";

  const designCSS =
    document.getElementById("newDesign").textContent;

  let loading = false;

  // ========================================
  // 관리자 지역 선택·특별할인 기간
  // ========================================
  function installFeatures() {
    function validDate(value) {
      if (!/^\d{4}-\d{2}-\d{2}$/.test(value || "")) {
        return false;
      }

      const date = new Date(value + "T00:00:00Z");

      return !Number.isNaN(date.getTime()) &&
        date.toISOString().slice(0, 10) === value;
    }

    function period(item) {
      if (
        !validDate(item.startDate) ||
        !validDate(item.endDate)
      ) {
        return "할인 기간 미설정";
      }

      return "할인 기간: " +
        item.startDate.replaceAll("-", ".") +
        " ~ " +
        item.endDate.replaceAll("-", ".");
    }

    // 기존 입력칸을 선택창으로 변경
    function selectField(id, options, selected, placeholder) {
      const input = $(id);
      const select = document.createElement("select");

      select.id = id;
      select.name = input.name;
      select.required = true;

      select.innerHTML =
        '<option value="">' + placeholder + '</option>' +
        options.map(value =>
          '<option value="' + escapeHTML(value) + '">' +
          escapeHTML(value) +
          '</option>'
        ).join("");

      select.value = options.includes(selected)
        ? selected
        : "";

      input.replaceWith(select);

      return select;
    }

    // 기존 등록·수정 기능 확장
    const originalEditor = openEditor;

    openEditor = function(index = null) {
      if (!admin || busy) return;

      originalEditor(index);

      if (!editing) return;

      const item = editing.original || {};

      if (["mainData", "eventData"].includes(editing.key)) {
        const map = regionMap();

        const city = selectField(
          "f-region",
          Object.keys(map),
          item.region || "",
          "시 / 군 선택"
        );

        const updateDong = selected => {
          const dong = selectField(
            "f-dong",
            map[city.value] || [],
            selected || "",
            "동 / 면 선택"
          );

          dong.disabled = !city.value;
        };

        updateDong(item.dong);

        city.addEventListener("change", () => {
          updateDong("");
        });
      }

      if (editing.key === "eventData") {
        $("fields").insertAdjacentHTML(
          "beforeend",
          field(
            "startDate",
            "할인 시작일",
            item.startDate || "",
            "date"
          ) +
          field(
            "endDate",
            "할인 종료일",
            item.endDate || "",
            "date"
          ) +
          '<p class="full muted">' +
          '시작일과 종료일을 포함한 할인 기간이에요.' +
          '</p>'
        );

        const start = $("f-startDate");
        const end = $("f-endDate");

        start.required = true;
        end.required = true;
        end.min = start.value;

        start.addEventListener("input", () => {
          end.min = start.value;
        });
      }
    };

    // 기존 저장 처리보다 먼저 입력값 검증
    $("editForm").addEventListener("submit", event => {
      if (!admin || busy || !editing) return;

      let message = "";

      if (["mainData", "eventData"].includes(editing.key)) {
        const region = $("f-region").value;
        const dong = $("f-dong").value;

        if (!(regionMap()[region] || []).includes(dong)) {
          message =
            "등록된 시 / 군과 해당 동 / 면을 선택해 주세요.";
        }
      }

      if (!message && editing.key === "eventData") {
        const start = $("f-startDate").value;
        const end = $("f-endDate").value;

        if (!validDate(start) || !validDate(end)) {
          message = "시작일과 종료일을 모두 선택해 주세요.";
        } else if (end < start) {
          message = "종료일은 시작일과 같거나 이후여야 해요.";
        }
      }

      if (message) {
        event.preventDefault();
        event.stopImmediatePropagation();

        $("editError").textContent = message;
        $("editError").hidden = false;
      }
    }, true);

    // 할인 카드에 기간 표시
    const originalCards = renderCards;

    renderCards = function() {
      originalCards();

      if (tab !== "eventData") return;

      $("cards").querySelectorAll(".card").forEach(card => {
        const button = card.querySelector("[data-detail]");

        const item = button &&
          db.eventData[Number(button.dataset.detail)];

        if (!item) return;

        const line = document.createElement("p");
        line.className = "event-period";
        line.textContent = period(item);

        const bottom = card.querySelector(".bottom");

        if (bottom) {
          bottom.before(line);
        } else {
          card.appendChild(line);
        }
      });
    };

    // 상세 화면에도 기간 표시
    const originalDetail = detail;

    detail = function(index) {
      originalDetail(index);

      if (tab === "eventData" && db[tab][index]) {
        $("detailMeta").textContent +=
          " · " + period(db[tab][index]);
      }
    };
  }

  // ========================================
  // 검색 초기화·바로가기
  // ========================================
  function connectDesign() {
    document.getElementById("resetSearch").addEventListener(
      "click",
      () => {
        ["search", "age", "category", "region", "dong"].forEach(
          id => {
            document.getElementById(id).value = "";
          }
        );

        document.getElementById("region").dispatchEvent(
          new Event("change", { bubbles: true })
        );

        document.getElementById("search").dispatchEvent(
          new Event("input", { bubbles: true })
        );

        document.getElementById("search").focus();
      }
    );

    document.querySelectorAll(".browse-trigger").forEach(
      button => {
        button.addEventListener("click", () => {
          document.querySelector(
            '#navigation [data-tab="mainData"]'
          ).click();

          document.getElementById("filters").scrollIntoView({
            behavior: matchMedia(
              "(prefers-reduced-motion: reduce)"
            ).matches ? "auto" : "smooth",
            block: "start"
          });

          document.getElementById("search").focus({
            preventScroll: true
          });
        });
      }
    );
  }

  // ========================================
  // 새 디자인·기능 적용
  // ========================================
  function build(page) {
    const script = [...page.querySelectorAll("script")].find(
      element =>
        element.textContent.includes("function openEditor(")
    );

    if (!script) {
      throw new Error("기존 기능 코드를 확인하지 못했어요.");
    }

    let code = script.textContent.replace(/\r\n?/g, "\n");

    const passwordPattern =
      /const ADMIN_PASSWORD\s*=\s*"[^"]*"\s*;/;

    const marker =
      '$("editForm").addEventListener("submit",';

    if (
      !passwordPattern.test(code) ||
      !code.includes(marker)
    ) {
      throw new Error(
        "기능 업데이트 위치를 확인하지 못했어요."
      );
    }

    // 관리자 비밀번호 변경
    code = code.replace(
      passwordPattern,
      'const ADMIN_PASSWORD = "1103";'
    );

    // 기존 저장 및 버튼 연결 전에 확장 기능 설치
    code = code.replace(
      marker,
      "(" + installFeatures.toString() + ")();\n" + marker
    );

    script.textContent = code;

    const style = page.createElement("style");
    style.textContent = designCSS;
    page.head.appendChild(style);

    page.title = "GY:ON — 오늘의 발견, 내일의 가능성";

    let theme = page.querySelector('meta[name="theme-color"]');

    if (!theme) {
      theme = page.createElement("meta");
      theme.name = "theme-color";
      page.head.appendChild(theme);
    }

    theme.content = "#f8f5ee";

    function create(tag, className, html) {
      const element = page.createElement(tag);
      element.className = className;
      element.innerHTML = html;
      return element;
    }

    // 헤더
    const top = page.querySelector(".top");

    top.insertBefore(
      create(
        "span",
        "header-message",
        "너의 일상에, 새로운 가능성"
      ),
      page.getElementById("adminButton")
    );

    page.getElementById("adminButton").textContent =
      "콘텐츠 관리 ↗";

    // 첫 화면
    const hero = page.querySelector(".hero");
    const copy = hero.firstElementChild;

    copy.classList.add("hero-copy");

    hero.querySelector(".eyebrow").textContent =
      "YOUR LOCAL OPPORTUNITY CLUB";

    hero.querySelector("h1").innerHTML =
      "우리 동네에서,<br><span>다음의 나를 발견.</span>";

    copy.querySelector("p").innerHTML =
      "놓치기 아까운 정책부터 기분 좋은 동네 할인까지.<br>" +
      "지금 나에게 필요한 기회를 한곳에서 만나봐.";

    copy.insertBefore(
      create(
        "div",
        "hero-actions",
        `
          <button type="button" class="hero-cta browse-trigger">
            내 기회 찾아보기
            <span aria-hidden="true">↗</span>
          </button>
          <span class="hero-small">
            작은 발견으로 시작하는 새로운 일상
          </span>
        `
      ),
      page.getElementById("stats")
    );

    // 캐릭터
    const art = page.querySelector(".hero-art");
    const floats = art.querySelectorAll(".float");

    if (floats[0]) {
      floats[0].textContent =
        "반가워! 오늘은 어떤 기회를 찾고 있어?";
    }

    if (floats[1]) {
      floats[1].textContent =
        "✦ 작은 발견, 큰 가능성";
    }

    art.appendChild(
      create(
        "span",
        "art-label",
        "MEET YOUR NEXT POSSIBILITY"
      )
    );

    // 소개 → 메뉴 → 검색 순서
    const bar = create(
      "div",
      "discovery-bar",
      `
        <b>LOCAL FINDS, BIG POSSIBILITIES</b>
        <span>정책 · 할인 · 취향 · 새로운 경험</span>
        <span>네 일상의 다음 페이지 ↗</span>
      `
    );

    const nav = page.getElementById("navigation");
    const filters = page.getElementById("filters");

    hero.after(bar);
    bar.after(nav);
    nav.after(filters);

    // 카드형 메뉴
    const menus = {
      mainData: ["정책 · 동네 혜택", "◎"],
      eventData: ["특별 할인", "✳"],
      goodsData: ["굿즈샵", "◇"],
      planData: ["파트너", "↗"]
    };

    nav.querySelectorAll("[data-tab]").forEach(button => {
      const menu = menus[button.dataset.tab];

      if (menu) {
        button.textContent = menu[0];
        button.dataset.icon = menu[1];
      }

      button.type = "button";

      button.setAttribute(
        "aria-pressed",
        String(button.classList.contains("active"))
      );
    });

    // 검색 영역
    filters.prepend(
      create(
        "div",
        "search-heading",
        `
          <div>
            <small>FIND YOUR NEXT</small>
            <h2>어떤 기회를 찾고 있어?</h2>
          </div>
          <button
            type="button"
            class="reset-search"
            id="resetSearch"
          >초기화 ↻</button>
        `
      )
    );

    const search = page.getElementById("search");

    search.placeholder =
      "교통비, 카페, 문화생활… 키워드로 찾아봐";

    search.parentElement.classList.add("keyword-field");

    page.getElementById("age").placeholder = "선택 입력";

    page.getElementById("connection").parentElement.classList.add(
      "connection-line"
    );

    // 콘텐츠 제목
    page.querySelector(".section-title").firstElementChild.prepend(
      create(
        "div",
        "section-kicker",
        "A LITTLE DISCOVERY FOR YOUR DAY"
      )
    );

    // 하단 배너
    page.getElementById("cards").after(
      create(
        "section",
        "brand-note",
        `
          <div>
            <small>YOUR NEXT CHAPTER STARTS HERE</small>
            <h3>아직 몰랐던 기회가,<br>바로 네 곁에.</h3>
            <p>
              청소년의 오늘과 지역의 가능성을 연결하는 GY:ON
            </p>
          </div>
          <button
            type="button"
            class="note-action browse-trigger"
            aria-label="혜택 검색으로 이동"
          >↗</button>
        `
      )
    );

    const extra = page.createElement("script");
    extra.textContent =
      "(" + connectDesign.toString() + ")();";
    page.body.appendChild(extra);

    return "<!DOCTYPE html>\n" +
      page.documentElement.outerHTML;
  }

  // ========================================
  // 기존 사이트 불러오기
  // ========================================
  async function request(url, json = false) {
    const controller = new AbortController();

    const timer = setTimeout(
      () => controller.abort(),
      15000
    );

    try {
      const response = await fetch(url, {
        signal: controller.signal,
        cache: "no-store",
        credentials: "omit"
      });

      if (!response.ok) {
        throw new Error(
          "서버 응답 오류: HTTP " + response.status
        );
      }

      return json
        ? await response.json()
        : await response.text();
    } finally {
      clearTimeout(timer);
    }
  }

  function parse(html) {
    const page = new DOMParser().parseFromString(
      html,
      "text/html"
    );

    const required = [
      ".top",
      ".hero",
      ".hero-art",
      ".section-title",
      "#stats",
      "#navigation",
      "#filters",
      "#cards",
      "#search",
      "#region",
      "#dong",
      "#age",
      "#category",
      "#adminButton",
      "#connection",
      "#editForm",
      "#fields",
      "#gyonMascot",
      "#checkoutForm"
    ];

    if (
      required.some(selector => !page.querySelector(selector))
    ) {
      throw new Error(
        "전체 사이트 코드를 받지 못했어요."
      );
    }

    return page;
  }

  async function loadSource() {
    try {
      return parse(
        await request(
          "https://raw.githubusercontent.com/hyun4115/gyon/" +
          revision +
          "/index.html"
        )
      );
    } catch (error) {
      const result = await request(
        "https://api.github.com/repos/hyun4115/gyon/contents/index.html?ref=" +
        revision,
        true
      );

      if (
        result.encoding !== "base64" ||
        typeof result.content !== "string"
      ) {
        throw new Error(
          "사이트를 불러오지 못했어요."
        );
      }

      const bytes = Uint8Array.from(
        atob(result.content.replace(/\s/g, "")),
        char => char.charCodeAt(0)
      );

      return parse(
        new TextDecoder().decode(bytes)
      );
    }
  }

  // ========================================
  // 실행
  // ========================================
  async function start() {
    if (loading) return;
    loading = true;

    const message =
      document.getElementById("loadingMessage");

    const retry =
      document.getElementById("retryButton");

    retry.hidden = true;
    message.textContent =
      "오늘의 새로운 기회를 불러오는 중…";

    let html;

    try {
      html = build(await loadSource());
    } catch (error) {
      loading = false;
      retry.hidden = false;

      message.textContent =
        "사이트를 불러오지 못했어요.\n" +
        "인터넷 연결을 확인하고 다시 눌러 주세요.\n\n" +
        (
          error.name === "AbortError"
            ? "연결 시간이 초과됐어요."
            : error.message
        );

      return;
    }

    document.open();
    document.write(html);
    document.close();
  }

  document.getElementById("retryButton").addEventListener(
    "click",
    start
  );

  start();
})();
</script>
