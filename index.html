<!-- GY:ON 공식 캐릭터 표시 수정 -->
<script>
(() => {
  "use strict";

  function fixCharacter() {
    const original = document.getElementById("brandOriginal");
    const mascot = document.getElementById("gyonMascot");

    if (!original || !mascot) {
      console.warn("GY:ON 원본 캐릭터를 찾지 못했어요.");
      return;
    }

    /* 기존 캐릭터의 배경색이 사이트 배경과 섞이지 않게 조정 */
    if (!document.getElementById("gyon-character-fix-style")) {
      const style = document.createElement("style");
      style.id = "gyon-character-fix-style";
      style.textContent = `
        .hero-art {
          isolation: isolate;
          position: relative;
          display: flex;
          align-items: flex-end;
          justify-content: center;
          min-height: 305px;
          height: auto;
          padding-top: 48px;
          box-sizing: border-box;
        }

        .hero-art .mascot {
          position: relative;
          z-index: 2;
          flex: 0 0 auto;
          width: 170px !important;
          height: 257px !important;
          max-width: 100%;
          margin: 0 !important;
          align-self: flex-end;
          mix-blend-mode: normal !important;
          filter: none !important;
          overflow: visible;
        }

        .mini-mascot,
        .receipt .mascot,
        .placeholder svg,
        .empty svg {
          mix-blend-mode: normal !important;
          filter: none !important;
        }

        .character-stage {
          z-index: 0;
          bottom: 8px;
          width: 235px;
          height: 210px;
          max-width: 95%;
          background: #dcebd9;
          border-radius: 48% 52% 44% 46%;
          transform: rotate(-6deg);
        }

        .hero-art .speech {
          z-index: 3;
          top: 0;
          left: 50%;
          transform: translateX(-50%) rotate(-3deg);
          width: max-content;
          max-width: calc(100% - 16px);
          box-sizing: border-box;
          white-space: normal;
          text-align: center;
          line-height: 1.6;
          padding: 11px 16px;
          border-radius: 18px;
          background: #fff;
          color: #25463d;
          border: 1px solid #dce7d9;
          box-shadow: 0 5px 16px #284b3910;
        }

        .hero-art .hero-sticker {
          z-index: 3;
          right: 0;
          bottom: 12px;
          padding: 9px 12px;
          border-radius: 12px;
          background: #fff3bb;
          color: #344b40;
          transform: rotate(5deg);
        }

        @media (max-width: 600px) {
          .hero-art {
            min-height: 258px;
            height: auto;
            margin-top: 22px;
            padding-top: 46px;
          }

          .hero-art .mascot {
            width: 140px !important;
            height: 212px !important;
          }

          .character-stage {
            width: 205px;
            height: 175px;
          }

          .hero-art .speech {
            left: 50%;
            top: 0;
            font-size: 11px;
          }

          .hero-art .hero-sticker {
            right: 0;
            bottom: 8px;
            font-size: 10px;
          }

          .hero-art .spark.one {
            left: 8%;
            top: 90px;
          }

          .hero-art .spark.two {
            right: 8%;
            top: 85px;
          }
        }
      `;
      document.head.appendChild(style);
    }

    const source =
      original.getAttribute("href") ||
      original.getAttributeNS(
        "http://www.w3.org/1999/xlink",
        "href"
      );

    if (!source) return;

    const image = new Image();

    image.onload = () => {
      try {
        /*
         * 공식 이미지 안의 정면 캐릭터.
         * 손 옆 하트가 잘리지 않도록 여백을 포함해 가져옴.
         */
        const crop = {
          x: 562,
          y: 88,
          width: 195,
          height: 295
        };

        const canvas = document.createElement("canvas");
        canvas.width = crop.width;
        canvas.height = crop.height;

        const context = canvas.getContext("2d", {
          willReadFrequently: true
        });

        if (!context) throw new Error("이미지 처리 기능 없음");

        const scaleX = image.naturalWidth / 1536;
        const scaleY = image.naturalHeight / 1024;

        context.drawImage(
          image,
          crop.x * scaleX,
          crop.y * scaleY,
          crop.width * scaleX,
          crop.height * scaleY,
          0,
          0,
          crop.width,
          crop.height
        );

        const pixels = context.getImageData(
          0, 0, canvas.width, canvas.height
        );

        const data = pixels.data;
        const width = canvas.width;
        const height = canvas.height;
        const count = width * height;

        const visited = new Uint8Array(count);
        const queue = new Uint32Array(count);

        let head = 0;
        let tail = 0;

        /*
         * 가장자리와 연결된 밝은 배경만 제거.
         * 캐릭터의 진한 테두리 안에 있는 흰 옷과 눈은 보존.
         */
        function isBackground(index) {
          const offset = index * 4;

          if (data[offset + 3] === 0) return true;

          const r = data[offset];
          const g = data[offset + 1];
          const b = data[offset + 2];

          return (
            r > 185 &&
            g > 195 &&
            b > 195 &&
            Math.max(r, g, b) - Math.min(r, g, b) < 55
          );
        }

        function enqueue(index) {
          if (visited[index]) return;
          visited[index] = 1;

          if (isBackground(index)) {
            queue[tail++] = index;
          }
        }

        for (let x = 0; x < width; x++) {
          enqueue(x);
          enqueue((height - 1) * width + x);
        }

        for (let y = 0; y < height; y++) {
          enqueue(y * width);
          enqueue(y * width + width - 1);
        }

        while (head < tail) {
          const index = queue[head++];
          const x = index % width;
          const y = Math.floor(index / width);

          data[index * 4 + 3] = 0;

          if (x > 0) enqueue(index - 1);
          if (x < width - 1) enqueue(index + 1);
          if (y > 0) enqueue(index - width);
          if (y < height - 1) enqueue(index + width);
        }

        context.putImageData(pixels, 0, 0);

        /*
         * 공용 캐릭터를 교체하면
         * 메인·굿즈·가상 결제 화면에 함께 적용됨.
         */
        const namespace = "http://www.w3.org/2000/svg";
        const cleanImage = document.createElementNS(
          namespace,
          "image"
        );

        cleanImage.setAttribute("width", String(width));
        cleanImage.setAttribute("height", String(height));
        cleanImage.setAttribute(
          "href",
          canvas.toDataURL("image/png")
        );

        mascot.setAttribute(
          "viewBox",
          `0 0 ${width} ${height}`
        );
        mascot.setAttribute(
          "preserveAspectRatio",
          "xMidYMid meet"
        );
        mascot.replaceChildren(cleanImage);
      } catch (error) {
        /* 처리 실패 시 기존 캐릭터를 유지 */
        console.warn("캐릭터 배경 처리 실패:", error);
      }
    };

    image.onerror = () => {
      console.warn("캐릭터 원본 이미지를 읽지 못했어요.");
    };

    image.src = source;
  }

  if (document.readyState === "loading") {
    document.addEventListener(
      "DOMContentLoaded",
      fixCharacter,
      { once: true }
    );
  } else {
    fixCharacter();
  }
})();
</script>
