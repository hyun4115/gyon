<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#10232e">
<title>GY:ON — 나의 가능성을 켜다</title>

<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: #f7f9f6;
    color: #182f3b;
    font-family: "Malgun Gothic", system-ui, sans-serif;
  }

  .opening {
    min-height: 100svh;
    display: grid;
    place-content: center;
    padding: 28px;
    text-align: center;
  }

  .opening-logo {
    font-size: 44px;
    font-weight: 900;
    letter-spacing: -3px;
  }

  .opening-logo span { color: #3b9e81; }

  .opening p {
    max-width: 460px;
    font-size: 13px;
    line-height: 1.9;
    color: #687c74;
    white-space: pre-line;
  }

  .opening-line {
    width: 44px;
    height: 3px;
    margin: 20px auto;
    background: #9bdab8;
    border-radius: 10px;
  }

  .opening button {
    padding: 12px 22px;
    border: 0;
    border-radius: 10px;
    background: #183c3d;
    color: white;
    font: inherit;
    cursor: pointer;
  }

  [hidden] { display: none !important; }
</style>

<style id="premiumDesign">
  /* 기본 디자인 */
  :root {
    --ink: #182f3b;
    --muted: #687a7b;
    --purple: #183e3d;
    --light: #eaf3ec;
    --mint: #c5f0d0;
    --line: #dfe7e2;
    --paper: #f7f9f6;
  }

  html {
    scroll-behavior: smooth;
    scroll-padding-top: 24px;
  }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family:
      Pretendard, "Noto Sans KR", "Malgun Gothic",
      -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  button, input, select, textarea { font: inherit; }
  button { touch-action: manipulation; }

  .wrap {
    max-width: 1256px;
    padding: 0 38px;
    margin-inline: auto;
  }

  .btn {
    background: #183e3d;
    color: white;
    border-radius: 10px;
    padding: 11px 17px;
    font-size: 13px;
    font-weight: 700;
    transition: background .2s, transform .2s, box-shadow .2s;
  }

  .btn.soft { background: #eaf2eb; color: #315e4b; }

  .btn.white {
    background: #fff;
    color: #36534a;
    border: 1px solid #dfe7e2;
  }

  .btn.danger { background: #fff0ef; color: #a7413e; }

  .btn:hover:not(:disabled) {
    transform: translateY(-2px);
    box-shadow: 0 5px 14px #193c3510;
  }

  button:focus-visible, a:focus-visible {
    outline: 3px solid #60b68d;
    outline-offset: 4px;
  }

  input, select, textarea {
    border: 1px solid #dce5df;
    border-radius: 10px;
    background: #fff;
    color: #263f3b;
    font-size: 13px;
  }

  input:focus, select:focus, textarea:focus {
    border-color: #68a78c;
    box-shadow: 0 0 0 3px #68a78c18;
  }

  /* 헤더 */
  .header {
    background: #fdfefb;
    border-bottom: 1px solid #e6ece6;
  }

  .top { height: 92px; gap: 20px; }
  .logo { width: 141px; height: 39px; }

  .tagline {
    margin-top: 1px;
    color: #6e8179;
    font-size: 8px;
    letter-spacing: 1.25px;
  }

  .header-message {
    display: flex;
    align-items: center;
    gap: 8px;
    color: #61766c;
    font-size: 11px;
  }

  .header-message::before {
    content: "";
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: #6daf8c;
  }

  #adminButton {
    background: transparent;
    border: 1px solid #dce5dc;
    color: #446154;
    padding: 10px 14px;
    font-size: 11px;
    border-radius: 100px;
  }

  /* 첫 화면 */
  .hero {
    position: relative;
    display: grid;
    grid-template-columns: 1.45fr 1fr;
    align-items: center;
    gap: 30px;
    min-height: 475px;
    margin: 25px 0 0;
    padding: 58px 55px 68px;
    border-radius: 27px;
    background: #10232e;
    overflow: hidden;
    isolation: isolate;
  }

  .hero::before {
    content: "";
    position: absolute;
    width: 620px;
    height: 620px;
    right: -230px;
    top: -280px;
    border: 1px solid #ffffff0c;
    border-radius: 50%;
    pointer-events: none;
    z-index: -1;
  }

  .hero::after {
    content: "ON";
    position: absolute;
    right: 24px;
    bottom: -73px;
    color: #ffffff04;
    font-size: 250px;
    font-weight: 900;
    letter-spacing: -22px;
    line-height: 1;
    pointer-events: none;
    z-index: -1;
  }

  .hero-copy { min-width: 0; }

  .hero .eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 9px;
    margin-bottom: 23px;
    color: #b2d7c2;
    font-size: 9px;
    font-weight: 650;
    letter-spacing: 2.3px;
  }

  .hero .eyebrow::before {
    content: "";
    width: 6px;
    height: 6px;
    background: #b9efc9;
    border-radius: 50%;
    box-shadow: 0 0 0 4px #b9efc910;
  }

  .hero h1 {
    margin: 0;
    color: #f6faf8;
    font-size: clamp(35px, 4vw, 53px);
    font-weight: 850;
    line-height: 1.3;
    letter-spacing: -2.9px;
    word-break: keep-all;
  }

  .hero h1 span { color: #c5f0d0; }

  .hero p {
    margin-top: 22px;
    color: #aabfc3;
    font-size: 13px;
    line-height: 1.95;
    letter-spacing: -.1px;
    word-break: keep-all;
  }

  .hero-actions {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 19px;
    margin-top: 27px;
  }

  .hero-cta {
    display: inline-flex;
    align-items: center;
    justify-content: space-between;
    gap: 33px;
    padding: 13px 19px;
    border: 0;
    border-radius: 9px;
    background: #c5f0d0;
    color: #173c32;
    font-size: 12px;
    font-weight: 800;
    cursor: pointer;
    transition: background .2s, transform .2s;
  }

  .hero-cta:hover {
    background: #d8f8df;
    transform: translateY(-2px);
  }

  .hero-cta span { font-size: 19px; font-weight: 400; }
  .hero-small { color: #9ab0b7; font-size: 10px; }

  .stats {
    display: flex;
    flex-wrap: wrap;
    gap: 0;
    margin-top: 31px;
    color: #9cb5bc;
    font-size: 10px;
  }

  .stats > span {
    padding: 0 18px;
    border-left: 1px solid #ffffff18;
  }

  .stats > span:first-child { border: 0; padding-left: 0; }

  .stats b {
    margin-right: 5px;
    color: #e0eee7;
    font-size: 18px;
    font-weight: 700;
  }

  /* 캐릭터 */
  .hero-art {
    position: relative;
    display: grid;
    place-items: center;
    min-height: 330px;
    height: 330px;
    margin: 0;
    transform: none;
    isolation: isolate;
  }

  .hero-art::before {
    content: "";
    position: absolute;
    width: 250px;
    max-width: 91%;
    height: 296px;
    background: #d4e9d6;
    border-radius: 140px 140px 30px 30px;
    box-shadow:
      inset 0 0 0 9px #ffffff17,
      0 18px 40px #00000012;
    z-index: -1;
  }

  .hero-art::after {
    content: "+";
    position: absolute;
    top: 39px;
    right: 13px;
    color: #accab6;
    font-size: 34px;
    font-weight: 200;
    transform: rotate(12deg);
    z-index: -1;
  }

  .hero-art .mascot {
    width: 202px;
    height: 266px;
    max-width: 90%;
    margin-top: 17px;
    filter: none;
    mix-blend-mode: normal;
  }

  .hero-art .float {
    position: absolute;
    top: 12px;
    right: -3px;
    padding: 10px 14px;
    border: 1px solid #ffffff44;
    border-radius: 9px;
    background: #f8faf3;
    color: #3d5a46;
    box-shadow: 0 8px 22px #00000014;
    font-size: 10px;
    font-weight: 700;
    transform: rotate(5deg);
  }

  .hero-art .float.bottom {
    top: auto;
    bottom: 4px;
    left: 1px;
    right: auto;
    background: #e9efb3;
    color: #536033;
    border-color: transparent;
    transform: rotate(-5deg);
  }

  .art-label {
    position: absolute;
    bottom: 37px;
    right: -9px;
    color: #a6bdba;
    font-size: 8px;
    letter-spacing: 2px;
    writing-mode: vertical-rl;
  }

  /* 검색 */
  .filters {
    position: relative;
    margin: -23px 29px 0;
    padding: 25px 28px 27px;
    background: #fff;
    border: 1px solid #e0e8e1;
    border-radius: 17px;
    box-shadow: 0 12px 30px #24442d08;
    scroll-margin-top: 25px;
    z-index: 2;
  }

  .search-heading {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 15px;
    margin-bottom: 17px;
  }

  .search-heading small {
    display: block;
    margin-bottom: 4px;
    color: #6d8b7a;
    font-size: 8px;
    font-weight: 600;
    letter-spacing: 1.6px;
  }

  .search-heading h2 {
    margin: 0;
    color: #2b473a;
    font-size: 19px;
    font-weight: 750;
    letter-spacing: -.7px;
  }

  .reset-search {
    flex-shrink: 0;
    border: 0;
    padding: 9px 0 9px 9px;
    background: transparent;
    color: #687d71;
    font-size: 11px;
    cursor: pointer;
  }

  .filter-grid {
    display: grid;
    grid-template-columns: 1.2fr 1fr 1fr .7fr;
    gap: 13px;
  }

  .filter-grid .keyword-field {
    grid-column: 1 / -1;
    grid-row: 1;
    position: relative;
    margin-bottom: 4px;
  }

  .keyword-field::before {
    content: "";
    position: absolute;
    left: 18px;
    top: 18px;
    width: 12px;
    height: 12px;
    border: 1.6px solid #668373;
    border-radius: 50%;
    pointer-events: none;
  }

  .keyword-field::after {
    content: "";
    position: absolute;
    left: 30px;
    top: 31px;
    width: 6px;
    height: 1.6px;
    background: #668373;
    transform: rotate(45deg);
    transform-origin: left;
    pointer-events: none;
  }

  .keyword-field label {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip-path: inset(50%);
  }

  #search {
    min-height: 53px;
    padding: 14px 17px 14px 46px;
    border: 1px solid #e5ebe5;
    border-radius: 10px;
    background: #f5f8f3;
    color: #29473a;
    font-size: 13px;
  }

  #search::placeholder { color: #7c8d80; }

  .filter-grid label {
    margin-bottom: 6px;
    color: #667f70;
    font-size: 10px;
    font-weight: 600;
  }

  .filter-grid select,
  .filter-grid input:not(#search) {
    min-height: 43px;
    padding: 10px 12px;
    border-radius: 8px;
    font-size: 12px;
  }

  /* 메뉴 */
  .nav {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 10px;
    margin-top: 29px;
    padding: 0;
    overflow: visible;
    background: transparent;
    border: 0;
    border-radius: 0;
  }

  .nav button {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: flex-start;
    gap: 12px;
    min-height: 70px;
    padding: 17px 19px;
    background: #f0f4ee;
    color: #597163;
    border: 1px solid #e2e8df;
    border-radius: 12px;
    font-size: 12px;
    font-weight: 700;
    text-align: left;
    transition: background .2s, border-color .2s;
  }

  .nav button::before {
    content: attr(data-number);
    color: #809a88;
    font-size: 10px;
    font-weight: 500;
    letter-spacing: .5px;
  }

  .nav button::after {
    content: "↗";
    margin-left: auto;
    color: #8da592;
    font-size: 18px;
    font-weight: 400;
  }

  .nav button.active {
    background: #173d37;
    border-color: #173d37;
    color: #f3f9f4;
  }

  .nav button.active::before,
  .nav button.active::after { color: #aed7b9; }

  .nav button:hover:not(.active) {
    background: #e8f0e4;
    border-color: #c4d6c3;
  }

  /* 연결 상태 */
  .connection-line { margin-top: 15px; gap: 10px; }

  .connection {
    padding: 7px 10px;
    border-radius: 7px;
    background: #edf3ec;
    color: #53745e;
    font-size: 10px;
    overflow-wrap: anywhere;
  }

  .connection.error { background: #fff0e9; color: #9c4a36; }

  #reloadButton {
    padding: 6px 9px;
    border-color: #e0e8df;
    background: transparent;
    color: #627e6a;
    font-size: 10px;
  }

  /* 카드 */
  .section-title {
    align-items: flex-end;
    gap: 15px;
    margin: 34px 0 21px;
  }

  .section-kicker {
    margin-bottom: 6px;
    color: #6f8a76;
    font-size: 8px;
    font-weight: 650;
    letter-spacing: 1.8px;
  }

  .section-title h2 {
    color: #253e35;
    font-size: 26px;
    font-weight: 800;
    letter-spacing: -1.1px;
    word-break: keep-all;
  }

  #resultCount {
    margin-top: 6px;
    color: #6f8376;
    font-size: 11px;
  }

  .section-title > .badge {
    padding: 0;
    background: transparent;
    color: #6e8576;
    font-size: 8px;
    letter-spacing: 1.4px;
  }

  .cards {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 17px;
  }

  .card {
    min-width: 0;
    padding: 25px 24px 22px;
    gap: 15px;
    border: 1px solid #dfe7df;
    border-radius: 15px;
    background: #fff;
    box-shadow: none;
    transition: transform .2s, box-shadow .2s, border-color .2s;
  }

  .card:hover {
    transform: translateY(-4px);
    border-color: #b2cdb6;
    box-shadow: 0 13px 27px #29432a09;
  }

  .badge {
    align-self: flex-start;
    padding: 5px 8px;
    border-radius: 5px;
    background: #edf2e9;
    color: #577445;
    font-size: 9px;
    font-weight: 750;
    letter-spacing: .1px;
  }

  .badge.green { background: #eaf4ed; color: #4c7b5d; }
  .badge.pink { background: #fff0e7; color: #99613b; }

  .card h3 {
    color: #294035;
    font-size: 17px;
    font-weight: 750;
    line-height: 1.6;
    letter-spacing: -.5px;
    word-break: keep-all;
    overflow-wrap: anywhere;
  }

  .card p { color: #6e8074; font-size: 12px; line-height: 1.9; }
  .meta { color: #6c8372; font-size: 10px; line-height: 1.8; }

  .card .bottom {
    gap: 10px;
    padding-top: 17px;
    border-top: 1px solid #edf1e9;
  }

  .card .bottom .btn {
    flex-shrink: 0;
    padding: 9px 10px;
    border: 1px solid #e0eadb;
    border-radius: 8px;
    background: #f2f6ee;
    color: #466c48;
    font-size: 10px;
  }

  .card .bottom .btn:hover {
    background: #e7f0de;
    box-shadow: none;
  }

  .price {
    color: #294d36;
    font-size: 27px;
    font-weight: 850;
    letter-spacing: -1px;
  }

  .card img, .placeholder {
    border-radius: 10px;
    background: #edf4e8;
  }

  .features { color: #627c69; font-size: 12px; line-height: 2; }

  .empty {
    padding: 62px 22px;
    border: 1px dashed #cbdac9;
    border-radius: 15px;
    background: #fff;
    color: #647e6b;
    font-size: 13px;
    line-height: 2;
  }

  .event-period {
    padding: 10px 12px;
    background: #edf4e9;
    border-radius: 8px;
    font-weight: 700;
    overflow-wrap: anywhere;
  }

  /* 하단 브랜드 영역 */
  .brand-note {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 25px;
    margin-top: 36px;
    padding: 34px 38px;
    border-radius: 18px;
    background: #e6efde;
    border: 1px solid #dbe7d3;
  }

  .brand-note small {
    color: #668357;
    font-size: 8px;
    font-weight: 650;
    letter-spacing: 1.8px;
  }

  .brand-note h3 {
    margin: 10px 0 8px;
    color: #345134;
    font-size: 25px;
    line-height: 1.4;
    font-weight: 750;
    letter-spacing: -1px;
  }

  .brand-note p { color: #69805f; font-size: 11px; }

  .note-action {
    display: grid;
    place-items: center;
    flex-shrink: 0;
    width: 62px;
    height: 62px;
    border: 1px solid #bdd1ad;
    border-radius: 50%;
    background: transparent;
    color: #4e7643;
    font-size: 30px;
    cursor: pointer;
    transition: background .2s, transform .2s;
  }

  .note-action:hover {
    background: #d8e8c9;
    transform: translate(2px, -2px);
  }

  .footer {
    gap: 18px;
    margin-top: 37px;
    padding: 28px 0 35px;
    border-top: 1px solid #dfe7dc;
    color: #6e8373;
    font-size: 10px;
  }

  .footer-logo { width: 96px; height: 29px; }

  /* 관리자·상세·가상 결제 */
  .admin {
    background: #edf4e8;
    border: 1px solid #d3e1ca;
    border-radius: 18px;
  }

  .admin-item {
    border: 1px solid #e0e8da;
    border-radius: 10px;
  }

  dialog {
    color: #263e34;
    background: #fffefa;
    border: 1px solid #dce6d8;
    border-radius: 20px;
    box-shadow: 0 25px 85px #14291f30;
  }

  dialog::backdrop {
    background: #10232e80;
    backdrop-filter: blur(5px);
  }

  .dialog-inner { padding: 29px; }
  .dialog-head h2 { color: #294434; font-size: 22px; }
  .close { background: #edf3e7; color: #536d48; }

  .checkout-summary, .receipt-table, .note {
    background: #eff4e9;
  }

  .demo-banner {
    background: #fff4da;
    color: #8a6b2d;
    font-size: 12px;
    line-height: 1.8;
  }

  .total-line strong { color: #315c39; }
  .toast { background: #193e35; border-radius: 10px; }

  #localCodebar, .local-codebar { display: none !important; }

  /* 태블릿 */
  @media (max-width: 960px) {
    .wrap { padding: 0 25px; }

    .hero {
      grid-template-columns: 1.3fr 1fr;
      gap: 15px;
      padding: 43px 33px 57px;
      min-height: 430px;
    }

    .hero h1 { font-size: 41px; letter-spacing: -2.4px; }
    .hero-art { height: 290px; min-height: 290px; }
    .hero-art::before { width: 218px; height: 267px; }
    .hero-art .mascot { width: 174px; height: 231px; }
    .hero-art .float { font-size: 9px; }
    .hero-art .float.bottom { bottom: 0; left: -5px; }
    .art-label, .header-message { display: none; }

    .nav button {
      min-height: 65px;
      padding: 15px 13px;
      gap: 9px;
      font-size: 11px;
    }

    .cards { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }

  /* 모바일 */
  @media (max-width: 600px) {
    .wrap { padding: 0 16px; }
    .top { height: 75px; gap: 12px; }
    .logo { width: 117px; height: 34px; }
    .tagline { display: none; }
    #adminButton { padding: 8px 11px; font-size: 10px; }

    .hero {
      display: block;
      min-height: 0;
      margin-top: 16px;
      padding: 33px 25px 40px;
      border-radius: 21px;
    }

    .hero .eyebrow {
      margin-bottom: 20px;
      font-size: 8px;
      letter-spacing: 1.5px;
    }

    .hero h1 {
      font-size: clamp(29px, 8.5vw, 43px);
      letter-spacing: -1.9px;
      line-height: 1.35;
    }

    .hero p { margin-top: 17px; font-size: 12px; line-height: 1.9; }
    .hero-actions { margin-top: 22px; gap: 12px; }
    .hero-cta { padding: 11px 15px; gap: 22px; font-size: 11px; }
    .hero-small { font-size: 9px; }
    .stats { margin-top: 24px; font-size: 9px; }
    .stats > span { padding: 0 12px; }
    .stats b { font-size: 16px; }

    .hero-art {
      height: 254px;
      min-height: 254px;
      margin-top: 27px;
    }

    .hero-art::before {
      width: 204px;
      height: 237px;
      border-radius: 110px 110px 23px 23px;
    }

    .hero-art::after { top: 38px; right: 13px; font-size: 29px; }

    .hero-art .mascot {
      width: 163px;
      height: 214px;
      margin-top: 13px;
    }

    .hero-art .float {
      top: 7px;
      right: 0;
      padding: 9px 10px;
      font-size: 9px;
    }

    .hero-art .float.bottom { top: auto; bottom: 1px; left: 0; }
    .hero::after { right: 15px; bottom: -43px; font-size: 175px; }

    .filters {
      margin: -16px 7px 0;
      padding: 21px 18px;
      border-radius: 15px;
    }

    .search-heading { gap: 8px; }
    .search-heading h2 { font-size: 16px; }
    .search-heading small { font-size: 7px; letter-spacing: 1.2px; }
    .reset-search { font-size: 10px; }
    .filter-grid { grid-template-columns: 1fr 1fr; gap: 12px; }
    .filter-grid > div:last-child { grid-column: auto; }
    .filter-grid .keyword-field { grid-column: 1 / -1; grid-row: 1; }
    #search { min-height: 50px; font-size: 12px; }

    .filter-grid select,
    .filter-grid input:not(#search) { font-size: 12px; padding: 10px; }

    .nav {
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      margin-top: 22px;
    }

    .nav button {
      min-height: 60px;
      padding: 13px 15px;
      font-size: 11px;
      border-radius: 10px;
    }

    .nav button::before { font-size: 9px; }
    .nav button::after { font-size: 17px; }
    .connection-line { align-items: flex-start; margin-top: 13px; }
    .connection { padding: 6px 8px; font-size: 9px; }
    #reloadButton { padding: 6px 8px; font-size: 9px; }
    .section-title { margin-top: 29px; margin-bottom: 17px; }
    .section-title h2 { font-size: 22px; }
    .section-title > .badge { display: none; }
    .cards { grid-template-columns: 1fr; gap: 13px; }
    .card { padding: 23px 22px; border-radius: 13px; }
    .card h3 { font-size: 17px; }
    .card p { font-size: 13px; }
    .card .bottom .btn, .meta { font-size: 11px; }
    .brand-note { padding: 25px 23px; gap: 16px; margin-top: 27px; }
    .brand-note small { font-size: 7px; letter-spacing: 1.1px; }
    .brand-note h3 { font-size: 21px; }
    .brand-note p { font-size: 10px; }
    .note-action { width: 44px; height: 44px; font-size: 24px; }
    .footer { gap: 13px; margin-top: 28px; padding-top: 23px; font-size: 9px; }
    .dialog-inner { padding: 22px; }
  }

  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }

    *, *::before, *::after {
      animation: none !important;
      transition: none !important;
    }
  }
</style>
</head>

<body>
<main class="opening">
  <div class="opening-logo">GY<span>:ON</span></div>
  <div class="opening-line" aria-hidden="true"></div>
  <p id="loadingMessage" role="status">나의 다음 기회를 불러오는 중…</p>
  <button id="retryButton" type="button" hidden>다시 불러오기</button>
</main>

<script>
(() => {
  "use strict";

  // 기존 기능이 들어 있는 고정 버전입니다.
  const revision = "e85117637a6c933f4d15e62887ac2690277ab7ae";

  const sourceURL =
    "https://raw.githubusercontent.com/hyun4115/gyon/" +
    revision + "/index.html";

  const fallbackURL =
    "https://api.github.com/repos/hyun4115/gyon/contents/index.html?ref=" +
    revision;

  const designCSS =
    document.getElementById("premiumDesign").textContent;

  let loading = false;

  // ========================================
  // 원본 코드 불러오기
  // ========================================
  async function request(url, asJSON = false) {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), 15000);

    try {
      const response = await fetch(url, {
        signal: controller.signal,
        cache: "no-store",
        credentials: "omit"
      });

      if (!response.ok) {
        throw new Error("서버 응답 오류: HTTP " + response.status);
      }

      return asJSON
        ? await response.json()
        : await response.text();
    } finally {
      clearTimeout(timer);
    }
  }

  function parseSource(html) {
    if (typeof html !== "string" || html.length < 10000) {
      throw new Error("전체 사이트 코드를 받지 못했어요.");
    }

    const page = new DOMParser().parseFromString(html, "text/html");

    const required = [
      ".top",
      ".hero",
      ".hero-art",
      ".section-title",
      "#stats",
      "#navigation",
      "#filters",
      "#search",
      "#region",
      "#dong",
      "#age",
      "#category",
      "#cards",
      "#gyonMascot",
      "#adminButton",
      "#connection",
      "#editForm",
      "#checkoutForm",
      "#fields"
    ];

    if (required.some(selector => !page.querySelector(selector))) {
      throw new Error("사이트의 필수 화면을 확인하지 못했어요.");
    }

    return page;
  }

  async function loadSource() {
    try {
      return parseSource(await request(sourceURL));
    } catch (firstError) {
      const result = await request(fallbackURL, true);

      if (
        result.encoding !== "base64" ||
        typeof result.content !== "string"
      ) {
        throw new Error("GitHub에서 사이트를 불러오지 못했어요.");
      }

      const binary = atob(result.content.replace(/\s/g, ""));
      const bytes = Uint8Array.from(
        binary,
        character => character.charCodeAt(0)
      );

      return parseSource(new TextDecoder().decode(bytes));
    }
  }

  // ========================================
  // 기존 기능에 지역 선택·할인 기간 추가
  // ========================================
  function patchFeatures(page) {
    const script = [...page.querySelectorAll("script")].find(
      element =>
        element.textContent.includes("function openEditor(") &&
        element.textContent.includes("function regionMap()")
    );

    if (!script) {
      throw new Error("관리자 기능 코드를 찾지 못했어요.");
    }

    let code = script.textContent.replace(/\r\n?/g, "\n");

    // 정확히 한 곳만 변경하도록 확인합니다.
    function replaceOnce(before, after) {
      const index = code.indexOf(before);

      if (
        index < 0 ||
        code.indexOf(before, index + before.length) >= 0
      ) {
        throw new Error(
          "기능 업데이트 위치를 확인하지 못했어요. 다시 불러와 주세요."
        );
      }

      code =
        code.slice(0, index) +
        after +
        code.slice(index + before.length);
    }

    // 이 함수들은 기존 기능 스크립트 안에 들어갑니다.
    const helpers = String.raw`
      // 등록된 시/군·동/면 선택창
      function regionSelect(name, label, options, selected = "") {
        return '<div>' +
          '<label for="f-' + name + '">' + label + '</label>' +
          '<select id="f-' + name + '" name="' + name + '" required>' +
          '<option value="">' + label + ' 선택</option>' +
          options.map(value =>
            '<option value="' + escapeHTML(value) + '"' +
            (value === selected ? ' selected' : '') + '>' +
            escapeHTML(value) + '</option>'
          ).join("") +
          '</select></div>';
      }

      // 시/군 변경 시 해당 동/면만 표시
      function fillEditorDongs(selected = "") {
        const region = $("f-region").value;
        const select = $("f-dong");
        const options = regionMap()[region] || [];

        select.innerHTML =
          '<option value="">동 / 면 선택</option>' +
          options.map(value =>
            '<option value="' + escapeHTML(value) + '">' +
            escapeHTML(value) + '</option>'
          ).join("");

        select.value = options.includes(selected) ? selected : "";
        select.disabled = !region;
      }

      // YYYY-MM-DD 형식과 실제 존재하는 날짜 확인
      function validEventDate(value) {
        if (!/^\d{4}-\d{2}-\d{2}$/.test(value || "")) {
          return false;
        }

        const date = new Date(value + "T00:00:00Z");

        return !Number.isNaN(date.getTime()) &&
          date.toISOString().slice(0, 10) === value;
      }

      // 할인 기간 저장 전 검증
      function validateEventDates(item) {
        if (
          !validEventDate(item.startDate) ||
          !validEventDate(item.endDate)
        ) {
          throw new Error(
            "특별할인의 시작일과 종료일을 모두 선택해 주세요."
          );
        }

        if (item.endDate < item.startDate) {
          throw new Error(
            "종료일은 시작일과 같거나 이후여야 해요."
          );
        }
      }

      // 카드·상세 화면의 기간 표시
      function eventPeriod(item) {
        if (
          !validEventDate(item.startDate) ||
          !validEventDate(item.endDate)
        ) {
          return "할인 기간 미설정";
        }

        return "할인 기간: " +
          item.startDate.replaceAll("-", ".") +
          " ~ " +
          item.endDate.replaceAll("-", ".");
      }
    `;

    replaceOnce(
      "function regionMap() {",
      helpers + "\nfunction regionMap() {"
    );

    // 시/군·동/면 자유 입력칸을 선택창으로 변경
    replaceOnce(
`            field(
                "region",
                "시 / 군",
                item.region || "고양시"
            ) +
            field(
                "dong",
                "동 / 면",
                item.dong || "식사동"
            ) +`,
`            regionSelect(
                "region",
                "시 / 군",
                Object.keys(regionMap()),
                item.region || ""
            ) +
            regionSelect(
                "dong",
                "동 / 면",
                regionMap()[item.region] || [],
                item.dong || ""
            ) +`
    );

    // 특별할인 등록·수정에 날짜 선택 추가
    replaceOnce(
`    $("fields").innerHTML = html;
    $("editError").hidden = true;`,
`    if (key === "eventData") {
        html +=
            field(
                "startDate",
                "할인 시작일",
                item.startDate || "",
                "date"
            ) +
            field(
                "endDate",
                "할인 종료일",
                item.endDate || "",
                "date"
            ) +
            '<p class="full muted">' +
            '시작일과 종료일을 포함한 할인 기간이에요. ' +
            '종료일은 시작일보다 빠를 수 없어요.' +
            '</p>';
    }

    $("fields").innerHTML = html;

    if (["mainData", "eventData"].includes(key)) {
        fillEditorDongs(item.dong || "");

        $("f-region").addEventListener(
            "change",
            () => fillEditorDongs()
        );
    }

    if (key === "eventData") {
        const start = $("f-startDate");
        const end = $("f-endDate");

        start.required = true;
        end.required = true;
        end.min = start.value;

        start.addEventListener("input", () => {
            end.min = start.value;
        });
    }

    $("editError").hidden = true;`
    );

    // 선택한 지역 및 할인 기간 확인 후 기존 저장 기능 실행
    replaceOnce(
`            item.ageMin = Number(item.ageMin);`,
`            if (!(regionMap()[item.region] || []).includes(item.dong)) {
                throw new Error(
                    "등록된 시 / 군과 해당 동 / 면을 선택해 주세요."
                );
            }

            if (context.key === "eventData") {
                validateEventDates(item);
            }

            item.ageMin = Number(item.ageMin);`
    );

    // 할인 카드에 기간 추가
    replaceOnce(
'                ${featuresHTML}\n\n                <div class="bottom">',
'                ${featuresHTML}\n' +
'                ${tab === "eventData" ? ' +
'\'<p class="event-period">\' + ' +
'escapeHTML(eventPeriod(item)) + \'</p>\' : ""}\n\n' +
'                <div class="bottom">'
    );

    // 상세 화면에 기간 추가
    replaceOnce(
'    $("detailLink").hidden = !link;',
`    if (tab === "eventData") {
        $("detailMeta").textContent += " · " + eventPeriod(item);
    }

    $("detailLink").hidden = !link;`
    );

    script.textContent = code;
  }

  // ========================================
  // 추가 버튼 연결
  // ========================================
  function connectDesign() {
    const reset = document.getElementById("resetSearch");

    reset.addEventListener("click", () => {
      ["search", "age", "category", "region", "dong"].forEach(id => {
        document.getElementById(id).value = "";
      });

      document.getElementById("region").dispatchEvent(
        new Event("change", { bubbles: true })
      );

      document.getElementById("search").dispatchEvent(
        new Event("input", { bubbles: true })
      );

      document.getElementById("search").focus();
    });

    document.querySelectorAll(".browse-trigger").forEach(button => {
      button.addEventListener("click", () => {
        const policyTab = document.querySelector(
          '#navigation [data-tab="mainData"]'
        );

        policyTab.click();

        const reduceMotion = window.matchMedia(
          "(prefers-reduced-motion: reduce)"
        ).matches;

        document.getElementById("filters").scrollIntoView({
          behavior: reduceMotion ? "auto" : "smooth",
          block: "start"
        });

        document.getElementById("search").focus({
          preventScroll: true
        });
      });
    });
  }

  // ========================================
  // 디자인 적용
  // ========================================
  function redesign(page) {
    page.title = "GY:ON — 나의 가능성을 켜다";

    const style = page.createElement("style");
    style.textContent = designCSS;
    page.head.appendChild(style);

    let theme = page.querySelector('meta[name="theme-color"]');

    if (!theme) {
      theme = page.createElement("meta");
      theme.name = "theme-color";
      page.head.appendChild(theme);
    }

    theme.content = "#10232e";

    // 헤더
    const top = page.querySelector(".top");
    const headerMessage = page.createElement("span");

    headerMessage.className = "header-message";
    headerMessage.textContent =
      "청소년과 지역을 연결하는 기회의 네트워크";

    top.insertBefore(
      headerMessage,
      page.getElementById("adminButton")
    );

    page.getElementById("adminButton").textContent =
      "콘텐츠 관리 ↗";

    // 첫 화면
    const hero = page.querySelector(".hero");
    const heroCopy = hero.firstElementChild;

    heroCopy.classList.add("hero-copy");

    hero.querySelector(".eyebrow").textContent =
      "GUIDE YOUTH. OPEN POSSIBILITIES.";

    hero.querySelector("h1").innerHTML =
      "기회는 가까이에.<br><span>가능성은 더 크게.</span>";

    heroCopy.querySelector("p").innerHTML =
      "청소년 정책부터 동네 할인, 새로운 경험까지.<br>" +
      "나에게 필요한 기회를 발견하고, 다음 일상을 켜봐.";

    const actions = page.createElement("div");
    actions.className = "hero-actions";

    actions.innerHTML = `
      <button type="button" class="hero-cta browse-trigger">
        나에게 맞는 혜택 찾기
        <span aria-hidden="true">↗</span>
      </button>
      <span class="hero-small">너의 다음 시작, GY:ON</span>
    `;

    heroCopy.insertBefore(actions, page.getElementById("stats"));

    // 기존 캐릭터 유지
    const heroArt = page.querySelector(".hero-art");
    const floating = heroArt.querySelectorAll(".float");

    if (floating[0]) {
      floating[0].textContent = "오늘의 가능성을 발견해 봐";
    }

    if (floating[1]) {
      floating[1].textContent = "✦ YOUR POSSIBILITY, ON.";
    }

    const artLabel = page.createElement("span");
    artLabel.className = "art-label";
    artLabel.textContent = "MEET YOUR NEXT OPPORTUNITY";
    heroArt.appendChild(artLabel);

    // 검색창
    const filters = page.getElementById("filters");
    hero.after(filters);

    const searchHeading = page.createElement("div");
    searchHeading.className = "search-heading";

    searchHeading.innerHTML = `
      <div>
        <small>YOUR NEXT OPPORTUNITY</small>
        <h2>지금, 어떤 기회를 찾고 있어?</h2>
      </div>
      <button
        id="resetSearch"
        class="reset-search"
        type="button"
      >초기화 ↻</button>
    `;

    filters.prepend(searchHeading);

    const search = page.getElementById("search");
    search.placeholder = "교통비, 문화생활, 카페… 관심 있는 키워드";
    search.parentElement.classList.add("keyword-field");

    page.getElementById("age").placeholder = "선택 입력";

    // 메뉴
    const menuLabels = {
      mainData: "정책 · 동네 혜택",
      eventData: "특별 할인",
      goodsData: "굿즈샵",
      planData: "파트너"
    };

    page.querySelectorAll("#navigation [data-tab]").forEach(
      (button, index) => {
        button.textContent =
          menuLabels[button.dataset.tab] || button.textContent;

        button.type = "button";
        button.dataset.number = String(index + 1).padStart(2, "0");

        button.setAttribute(
          "aria-pressed",
          String(button.classList.contains("active"))
        );
      }
    );

    page.getElementById("connection").parentElement.classList.add(
      "connection-line"
    );

    // 콘텐츠 제목
    const sectionTitle = page.querySelector(".section-title");
    const kicker = page.createElement("div");

    kicker.className = "section-kicker";
    kicker.textContent = "DISCOVER WHAT’S NEXT";
    sectionTitle.firstElementChild.prepend(kicker);

    // 하단 브랜드 영역
    const brandNote = page.createElement("section");
    brandNote.className = "brand-note";

    brandNote.innerHTML = `
      <div>
        <small>SMALL DISCOVERY. BIG POSSIBILITY.</small>
        <h3>다음 기회는,<br>생각보다 가까이에.</h3>
        <p>청소년의 오늘과 지역의 가능성을 연결해.</p>
      </div>
      <button
        type="button"
        class="note-action browse-trigger"
        aria-label="혜택 검색으로 이동"
      >↗</button>
    `;

    page.getElementById("cards").after(brandNote);

    // 기존 기능이 실행된 다음 추가 버튼 연결
    const enhancement = page.createElement("script");
    enhancement.textContent =
      "(" + connectDesign.toString() + ")();";
    page.body.appendChild(enhancement);

    return "<!DOCTYPE html>\n" + page.documentElement.outerHTML;
  }

  // ========================================
  // 시작
  // ========================================
  async function start() {
    if (loading) return;
    loading = true;

    const message = document.getElementById("loadingMessage");
    const retry = document.getElementById("retryButton");

    message.textContent = "나의 다음 기회를 불러오는 중…";
    retry.hidden = true;

    let html;

    try {
      const page = await loadSource();

      // 등록된 지역 선택 + 특별할인 기간
      patchFeatures(page);

      // 네이비·민트 디자인
      html = redesign(page);
    } catch (error) {
      loading = false;
      retry.hidden = false;

      message.textContent =
        "사이트를 불러오지 못했어요.\n" +
        "인터넷 연결을 확인하고 다시 눌러 주세요.\n\n" +
        (
          error.name === "AbortError"
            ? "연결 시간이 초과됐어요."
            : error.message
        );

      return;
    }

    document.open();
    document.write(html);
    document.close();
  }

  document.getElementById("retryButton").addEventListener(
    "click",
    start
  );

  start();
})();
</script>
</body>
</html>
