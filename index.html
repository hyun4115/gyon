<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f7f8f2">
<title>GY:ON · 나의 가능성을 켜다</title>

<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: #f7f8f2;
    color: #244b40;
    font-family: "Malgun Gothic", system-ui, sans-serif;
  }

  .opening {
    min-height: 100svh;
    display: grid;
    place-content: center;
    padding: 28px;
    text-align: center;
  }

  .opening strong {
    font-size: 38px;
    letter-spacing: -2px;
  }

  .opening strong span { color: #439b7b; }

  .opening p {
    max-width: 430px;
    font-size: 14px;
    line-height: 1.8;
    color: #6c8075;
    white-space: pre-line;
  }

  .opening button {
    padding: 12px 22px;
    border: 0;
    border-radius: 12px;
    background: #285a48;
    color: #fff;
    font: inherit;
    cursor: pointer;
  }

  [hidden] { display: none !important; }
</style>

<!-- 불러온 전체 사이트에 적용할 디자인 -->
<style id="newDesign">
  :root {
    --ink: #243f36;
    --muted: #738177;
    --purple: #315d49;
    --light: #edf3e8;
    --mint: #d9ebce;
    --line: #e3e8dd;
    --paper: #f7f8f2;
  }

  html { scroll-behavior: smooth; }

  body {
    background: var(--paper);
    color: var(--ink);
    font-family: Pretendard, "Noto Sans KR",
      "Malgun Gothic", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .wrap {
    max-width: 1180px;
    padding: 0 32px;
  }

  .header {
    background: #fffefa;
    border-bottom: 1px solid var(--line);
  }

  .top { height: 94px; }

  .logo {
    width: 145px;
    height: 40px;
  }

  .tagline {
    margin-top: 2px;
    font-size: 8px;
    letter-spacing: 1.5px;
    color: #849084;
  }

  .header-message {
    font-size: 12px;
    color: #71806e;
    letter-spacing: -.2px;
  }

  .btn {
    background: #315d49;
    border-radius: 12px;
    padding: 11px 17px;
    font-size: 13px;
    font-weight: 700;
  }

  .btn.soft {
    background: #edf2e8;
    color: #436246;
  }

  .btn.white {
    background: #fffefa;
    color: #45604e;
    border-color: #e1e6d9;
  }

  .btn.danger {
    background: #fff0ef;
    color: #aa4540;
  }

  .btn:hover:not(:disabled) {
    transform: translateY(-2px);
    box-shadow: 0 5px 12px #244b400d;
  }

  button:focus-visible,
  a:focus-visible {
    outline: 3px solid #87b99a;
    outline-offset: 4px;
  }

  .hero {
    margin: 28px 0 0;
    padding: 54px 56px 60px;
    grid-template-columns: 1.3fr 1fr;
    gap: 24px;
    min-height: 410px;
    border-radius: 30px;
    background: #e8efdf;
    overflow: hidden;
    isolation: isolate;
  }

  .hero::after {
    content: "";
    position: absolute;
    right: -85px;
    top: -105px;
    width: 350px;
    height: 350px;
    border: 1px solid #d5e1c9;
    border-radius: 50%;
    z-index: -1;
  }

  .eyebrow {
    color: #6d8562;
    font-size: 10px;
    font-weight: 750;
    letter-spacing: 2px;
  }

  .hero .eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 19px;
  }

  .hero .eyebrow::before {
    content: "";
    width: 6px;
    height: 6px;
    background: #679461;
    border-radius: 50%;
  }

  .hero h1 {
    font-size: clamp(34px, 4vw, 49px);
    line-height: 1.3;
    letter-spacing: -2.3px;
    font-weight: 850;
    color: #2e4434;
    word-break: keep-all;
  }

  .hero h1 span { color: #619050; }

  .hero p {
    margin-top: 18px;
    font-size: 14px;
    line-height: 1.9;
    color: #73816a;
    word-break: keep-all;
  }

  .hero-link {
    display: inline-flex;
    align-items: center;
    gap: 28px;
    margin-top: 24px;
    padding: 12px 20px;
    border: 0;
    border-radius: 100px;
    background: #31553d;
    color: #fff;
    font-size: 12px;
    font-weight: 700;
    text-decoration: none;
    cursor: pointer;
  }

  .hero-link span { font-size: 18px; }

  .stats {
    margin-top: 27px;
    gap: 20px;
    flex-wrap: wrap;
    color: #78846f;
    font-size: 10px;
  }

  .stats b {
    font-size: 17px;
    color: #4b6243;
  }

  .hero-art {
    align-self: center;
    min-height: 280px;
    transform: none;
  }

  .hero-art::before {
    content: "";
    position: absolute;
    width: 265px;
    height: 240px;
    max-width: 100%;
    bottom: 0;
    background: #d6e4ca;
    border-radius: 48% 52% 43% 46%;
    transform: rotate(-8deg);
    z-index: -1;
  }

  .hero-art .mascot {
    width: 198px;
    height: 260px;
    filter: none;
    mix-blend-mode: normal;
  }

  .hero-art .float {
    top: 4px;
    right: -8px;
    background: #fffef9;
    color: #59704d;
    border: 1px solid #e2e8d8;
    padding: 10px 15px;
    border-radius: 14px;
    box-shadow: 0 5px 15px #455c3908;
    font-size: 11px;
    transform: rotate(5deg);
  }

  .hero-art .float.bottom {
    top: auto;
    bottom: 0;
    left: -8px;
    right: auto;
    background: #fff0b9;
    border-color: transparent;
    color: #73633d;
    transform: rotate(-5deg);
  }

  .filters {
    position: relative;
    margin: -22px 24px 0;
    padding: 27px 30px;
    background: #fffefa;
    border: 1px solid #e3e7d9;
    border-radius: 22px;
    box-shadow: 0 12px 30px #354b2d08;
    scroll-margin-top: 24px;
  }

  .search-heading {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
    margin-bottom: 18px;
  }

  .search-heading h2 {
    margin: 0;
    font-size: 19px;
    letter-spacing: -.6px;
  }

  .search-heading small {
    display: block;
    margin-bottom: 4px;
    color: #8b9981;
    font-size: 8px;
    letter-spacing: 1.6px;
  }

  .reset-search {
    flex-shrink: 0;
    background: transparent;
    border: 0;
    color: #7a8770;
    font-size: 11px;
    padding: 8px;
    cursor: pointer;
  }

  .filter-grid {
    grid-template-columns: 1.2fr 1fr 1fr .7fr;
    gap: 15px;
  }

  .filter-grid .keyword-field {
    grid-column: 1 / -1;
    grid-row: 1;
    margin-bottom: 3px;
  }

  .keyword-field label {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip-path: inset(50%);
  }

  #search {
    min-height: 53px;
    padding: 15px 18px;
    background: #f3f5ed;
    border: 1px solid #e8ecdf;
    border-radius: 13px;
    font-size: 14px;
  }

  input, select, textarea {
    color: #354b3d;
    background: #fffefa;
    border-color: #e0e6d9;
    border-radius: 10px;
    font-size: 13px;
  }

  input:focus, select:focus, textarea:focus {
    border-color: #88ab74;
    box-shadow: 0 0 0 3px #88ab7418;
  }

  .filter-grid label {
    margin-bottom: 7px;
    color: #829078;
    font-size: 10px;
  }

  .nav {
    margin-top: 30px;
    padding: 7px;
    gap: 5px;
    background: #ecefe5;
    border: 1px solid #e4e8dc;
    border-radius: 16px;
  }

  .nav button {
    flex: 1;
    padding: 13px 15px;
    border-radius: 11px;
    color: #7c8873;
    font-size: 13px;
    transition: background .18s, color .18s;
  }

  .nav button.active {
    background: #fffefa;
    color: #365a3b;
    box-shadow: 0 3px 9px #4356370b;
  }

  .nav button:hover:not(.active) {
    background: #e1e7d8;
    color: #45613d;
  }

  .connection-line {
    margin-top: 13px;
    gap: 8px;
  }

  .connection {
    padding: 7px 10px;
    border-radius: 8px;
    background: #eff3e9;
    color: #738368;
    font-size: 10px;
    overflow-wrap: anywhere;
  }

  .connection.error {
    background: #fff0e9;
    color: #9e513a;
  }

  #reloadButton {
    padding: 6px 10px;
    font-size: 10px;
  }

  .section-title {
    margin: 32px 0 19px;
    align-items: flex-end;
    gap: 12px;
  }

  .section-title h2 {
    font-size: 24px;
    letter-spacing: -1px;
    color: #344c37;
  }

  #resultCount {
    margin-top: 5px;
    font-size: 11px;
    color: #8b9582;
  }

  .section-title > .badge {
    background: transparent;
    color: #96a18b;
    font-size: 8px;
    letter-spacing: 1.2px;
  }

  .cards {
    gap: 17px;
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

  .card {
    padding: 25px;
    gap: 14px;
    border-radius: 18px;
    background: #fffefa;
    border: 1px solid #e3e8db;
    box-shadow: 0 2px 4px #4c593503;
    min-width: 0;
  }

  .card:hover {
    transform: translateY(-4px);
    border-color: #bfd0af;
    box-shadow: 0 12px 26px #40512b0b;
  }

  .card h3 {
    font-size: 17px;
    line-height: 1.65;
    color: #364d38;
    letter-spacing: -.5px;
    word-break: keep-all;
    overflow-wrap: anywhere;
  }

  .card p {
    color: #8a9381;
    font-size: 12px;
    line-height: 1.85;
  }

  .meta {
    color: #939c89;
    font-size: 11px;
  }

  .badge {
    padding: 5px 9px;
    background: #edf1e4;
    color: #6c8256;
    font-size: 10px;
    border-radius: 6px;
  }

  .badge.green {
    background: #e6f1e9;
    color: #62876b;
  }

  .badge.pink {
    background: #fbede4;
    color: #ac8465;
  }

  .card .bottom {
    border-top-color: #edf0e7;
    padding-top: 16px;
  }

  .card .bottom .btn {
    padding: 9px 13px;
    font-size: 11px;
  }

  .price {
    font-size: 23px;
    color: #395a3e;
  }

  .card img, .placeholder {
    border-radius: 12px;
    background: #eef2e7;
  }

  .empty {
    padding: 65px 22px;
    border-color: #d5deca;
    background: #fffefa;
    color: #859178;
    font-size: 13px;
    line-height: 2;
  }

  .closing-message {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    margin-top: 34px;
    padding: 28px 32px;
    background: #eaf0e1;
    border-radius: 18px;
    color: #526b43;
  }

  .closing-message small {
    font-size: 8px;
    letter-spacing: 1.4px;
    color: #8d9d7e;
  }

  .closing-message h3 {
    margin: 7px 0;
    font-size: 20px;
    letter-spacing: -.7px;
  }

  .closing-message p {
    font-size: 11px;
    color: #8a977d;
  }

  .closing-message > span {
    font-size: 45px;
    font-weight: 300;
    color: #91aa7e;
  }

  .footer {
    margin-top: 35px;
    padding: 26px 0 35px;
    border-color: #e1e6d8;
    font-size: 10px;
    color: #95a089;
  }

  .footer-logo {
    width: 95px;
    height: 29px;
  }

  .admin {
    background: #eef3e8;
    border-color: #d7e2cb;
    border-radius: 20px;
  }

  .admin-item {
    border: 1px solid #e5ebde;
    border-radius: 12px;
  }

  dialog {
    background: #fffefa;
    border-radius: 22px;
    border-color: #e4e9dd;
    box-shadow: 0 24px 80px #21382b25;
  }

  dialog::backdrop {
    background: #273c3059;
    backdrop-filter: blur(5px);
  }

  .dialog-inner { padding: 30px; }

  .close {
    background: #edf2e6;
    color: #617450;
  }

  .checkout-summary,
  .receipt-table,
  .note {
    background: #f0f4e9;
  }

  .demo-banner {
    background: #fcf3d9;
    color: #97804a;
    font-size: 12px;
  }

  .total-line strong { color: #416a49; }

  /* 隐藏旧版本的代码工具条，不影响服务器错误提示 */
  #localCodebar,
  .local-codebar {
    display: none !important;
  }

  @media (max-width: 900px) {
    .hero {
      grid-template-columns: 1.2fr 1fr;
      padding: 40px 32px 48px;
    }

    .hero-art .mascot {
      width: 175px;
      height: 235px;
    }

    .hero-art::before {
      width: 225px;
      height: 205px;
    }

    .hero-art .float {
      right: -3px;
      font-size: 10px;
    }

    .cards {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .header-message { display: none; }
  }

  @media (max-width: 600px) {
    .wrap { padding: 0 17px; }

    .top { height: 76px; }

    .logo {
      width: 116px;
      height: 35px;
    }

    #adminButton {
      padding: 9px 11px;
      font-size: 11px;
    }

    .hero {
      display: block;
      margin-top: 17px;
      padding: 30px 25px 38px;
      border-radius: 23px;
      min-height: 0;
    }

    .hero .eyebrow {
      font-size: 8px;
      letter-spacing: 1.4px;
      margin-bottom: 14px;
    }

    .hero h1 {
      font-size: 34px;
      letter-spacing: -1.8px;
    }

    .hero p {
      font-size: 12px;
      line-height: 1.85;
      margin-top: 14px;
    }

    .hero-link {
      margin-top: 19px;
      padding: 10px 17px;
      font-size: 11px;
    }

    .stats {
      margin-top: 21px;
      gap: 17px;
    }

    .stats b { font-size: 15px; }

    .hero-art {
      display: grid;
      height: 215px;
      min-height: 215px;
      margin-top: 24px;
      transform: none;
    }

    .hero-art .mascot {
      width: 156px;
      height: 210px;
    }

    .hero-art::before {
      width: 225px;
      height: 175px;
    }

    .hero-art .float {
      top: 15px;
      right: 0;
      padding: 8px 10px;
      font-size: 9px;
    }

    .hero-art .float.bottom {
      bottom: 4px;
      left: 0;
      top: auto;
      padding: 8px 10px;
      font-size: 9px;
    }

    .filters {
      margin: -15px 7px 0;
      padding: 20px 18px;
      border-radius: 18px;
    }

    .search-heading { gap: 5px; }

    .search-heading h2 { font-size: 16px; }

    .search-heading small {
      font-size: 7px;
      letter-spacing: 1px;
    }

    .reset-search {
      padding: 6px 0 6px 5px;
      font-size: 10px;
    }

    .filter-grid {
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .filter-grid > div:last-child {
      grid-column: auto;
    }

    .filter-grid .keyword-field {
      grid-column: 1 / -1;
      grid-row: 1;
    }

    #search {
      font-size: 12px;
      min-height: 48px;
      padding: 12px;
    }

    .filter-grid input,
    .filter-grid select {
      font-size: 12px;
      padding: 10px;
    }

    .nav {
      margin-top: 23px;
      padding: 5px;
      gap: 2px;
      border-radius: 12px;
    }

    .nav button {
      padding: 11px 7px;
      font-size: 11px;
      border-radius: 8px;
    }

    .connection-line { align-items: flex-start; }

    .connection { font-size: 9px; }

    #reloadButton { font-size: 9px; }

    .section-title { margin-top: 25px; }

    .section-title h2 { font-size: 21px; }

    .section-title > .badge { display: none; }

    .cards {
      grid-template-columns: 1fr;
      gap: 13px;
    }

    .card { padding: 22px; }

    .card h3 { font-size: 17px; }

    .card p { font-size: 13px; }

    .closing-message {
      padding: 24px;
      margin-top: 25px;
    }

    .closing-message h3 { font-size: 17px; }

    .closing-message > span { font-size: 34px; }

    .footer { gap: 12px; }

    .dialog-inner { padding: 23px; }
  }

  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }

    *, *::before, *::after {
      transition: none !important;
      animation: none !important;
    }
  }
</style>
</head>

<body>
<main class="opening">
  <strong>GY<span>:ON</span></strong>
  <p id="loadingMessage" role="status">우리 동네의 기회를 불러오는 중…</p>
  <button id="retryButton" type="button" hidden>다시 불러오기</button>
</main>

<script>
(() => {
  "use strict";

  /*
   * 기존 index.html 전체를 이 코드로 교체.
   * 복구 안내창과 코드 복사 팝업은 만들지 않음.
   * 기존 등록·수정·가상 결제 기능은 저장된 전체 버전을 사용.
   */

  const revision = "e85117637a6c933f4d15e62887ac2690277ab7ae";

  const originalURL =
    "https://raw.githubusercontent.com/hyun4115/gyon/" +
    revision +
    "/index.html";

  const fallbackURL =
    "https://api.github.com/repos/hyun4115/gyon/contents/index.html?ref=" +
    revision;

  const designCSS =
    document.getElementById("newDesign").textContent;

  let loading = false;

  async function request(url, json = false) {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), 15000);

    try {
      const response = await fetch(url, {
        signal: controller.signal,
        cache: "no-store",
        credentials: "omit"
      });

      if (!response.ok) {
        throw new Error("HTTP " + response.status);
      }

      return json
        ? await response.json()
        : await response.text();
    } finally {
      clearTimeout(timer);
    }
  }

  function validateSource(html) {
    if (
      typeof html !== "string" ||
      html.length < 10000
    ) {
      throw new Error("전체 사이트 코드를 받지 못했어요.");
    }

    const parsed = new DOMParser().parseFromString(
      html,
      "text/html"
    );

    const required = [
      "#navigation",
      "#filters",
      "#search",
      "#cards",
      "#gyonMascot",
      "#adminButton",
      "#editForm",
      "#checkoutForm"
    ];

    if (required.some(selector => !parsed.querySelector(selector))) {
      throw new Error("사이트의 필수 기능을 확인하지 못했어요.");
    }

    return parsed;
  }

  async function loadSource() {
    try {
      return validateSource(await request(originalURL));
    } catch (error) {
      const result = await request(fallbackURL, true);

      if (
        result.encoding !== "base64" ||
        typeof result.content !== "string"
      ) {
        throw new Error("GitHub에서 사이트를 불러오지 못했어요.");
      }

      const binary = atob(result.content.replace(/\s/g, ""));
      const bytes = Uint8Array.from(
        binary,
        character => character.charCodeAt(0)
      );

      return validateSource(
        new TextDecoder().decode(bytes)
      );
    }
  }

  /*
   * 기존 사이트가 실행된 뒤 연결할 기능.
   * 입력창을 바꾸면 기존 검색 기능에 동일하게 전달.
   */
  function connectDesign() {
    const reset = document.getElementById("resetSearch");
    const find = document.getElementById("findBenefits");

    reset.addEventListener("click", () => {
      ["search", "age", "category", "region", "dong"].forEach(id => {
        document.getElementById(id).value = "";
      });

      document.getElementById("region").dispatchEvent(
        new Event("change", { bubbles: true })
      );

      document.getElementById("search").dispatchEvent(
        new Event("input", { bubbles: true })
      );

      document.getElementById("search").focus();
    });

    find.addEventListener("click", () => {
      const policyTab = document.querySelector(
        '#navigation [data-tab="mainData"]'
      );

      policyTab.click();

      document.getElementById("filters").scrollIntoView({
        behavior: window.matchMedia(
          "(prefers-reduced-motion: reduce)"
        ).matches ? "auto" : "smooth",
        block: "start"
      });

      document.getElementById("search").focus({
        preventScroll: true
      });
    });
  }

  function redesign(page) {
    page.title = "GY:ON · 나의 가능성을 켜다";

    // 기본 스타일 다음에 새 디자인 적용.
    const style = page.createElement("style");
    style.textContent = designCSS;
    page.head.appendChild(style);

    const theme = page.createElement("meta");
    theme.name = "theme-color";
    theme.content = "#f7f8f2";
    page.head.appendChild(theme);

    // 헤더의 짧은 브랜드 메시지.
    const header = page.querySelector(".top");
    const message = page.createElement("span");
    message.className = "header-message";
    message.textContent = "청소년의 오늘에, 새로운 가능성을.";
    header.insertBefore(
      message,
      page.getElementById("adminButton")
    );

    page.getElementById("adminButton").textContent = "콘텐츠 관리";

    // 메인 소개 문구와 검색 이동 버튼.
    const hero = page.querySelector(".hero");
    const heroCopy = hero.firstElementChild;

    hero.querySelector(".eyebrow").textContent =
      "EVERY OPPORTUNITY, FOR YOU";

    hero.querySelector("h1").innerHTML =
      "우리 동네에서 찾는<br>나의 다음 <span>가능성.</span>";

    heroCopy.querySelector("p").innerHTML =
      "청소년 정책, 동네 할인, 새로운 경험까지.<br>" +
      "흩어져 있던 기회를 GY:ON에서 만나봐.";

    const find = page.createElement("button");
    find.type = "button";
    find.id = "findBenefits";
    find.className = "hero-link";
    find.innerHTML = "내 혜택 찾아보기 <span aria-hidden=\"true\">↗</span>";

    heroCopy.insertBefore(
      find,
      page.getElementById("stats")
    );

    const floating = hero.querySelectorAll(".float");

    if (floating[0]) {
      floating[0].textContent = "오늘은 어떤 기회를 만나볼까?";
    }

    if (floating[1]) {
      floating[1].textContent = "✦ 나의 가능성을 ON!";
    }

    // 검색창을 메인 소개 바로 아래로 이동.
    const filters = page.getElementById("filters");
    hero.after(filters);

    const searchHeading = page.createElement("div");
    searchHeading.className = "search-heading";
    searchHeading.innerHTML = `
      <div>
        <small>FIND YOUR OPPORTUNITY</small>
        <h2>어떤 혜택을 찾고 있어?</h2>
      </div>
      <button
        id="resetSearch"
        class="reset-search"
        type="button"
      >초기화 ↻</button>
    `;

    filters.prepend(searchHeading);

    const search = page.getElementById("search");
    search.placeholder = "교통비, 문화생활, 카페… 키워드로 찾아봐";
    search.parentElement.classList.add("keyword-field");

    const age = page.getElementById("age");
    age.placeholder = "선택 입력";

    // 연결 상태와 오류 안내는 계속 표시.
    const connection = page.getElementById("connection");
    connection.parentElement.classList.add("connection-line");

    // 메뉴의 기존 동작을 유지하고 문구만 간결하게.
    const navigationLabels = {
      mainData: "정책 · 동네 혜택",
      eventData: "특별 할인",
      goodsData: "굿즈샵",
      planData: "파트너"
    };

    page.querySelectorAll("#navigation [data-tab]").forEach(button => {
      button.textContent =
        navigationLabels[button.dataset.tab] || button.textContent;

      button.type = "button";
      button.setAttribute(
        "aria-pressed",
        String(button.classList.contains("active"))
      );
    });

    // 콘텐츠 아래의 브랜드 문구.
    const closing = page.createElement("section");
    closing.className = "closing-message";
    closing.innerHTML = `
      <div>
        <small>SMALL DISCOVERY, BIG POSSIBILITY</small>
        <h3>작은 발견이, 더 큰 가능성으로.</h3>
        <p>청소년과 지역을 연결하는 기회의 네트워크</p>
      </div>
      <span aria-hidden="true">↗</span>
    `;

    page.getElementById("cards").after(closing);

    // 기존 기능 스크립트 실행 후 추가 버튼 연결.
    const enhancement = page.createElement("script");
    enhancement.textContent = "(" + connectDesign.toString() + ")();";
    page.body.appendChild(enhancement);

    return "<!DOCTYPE html>\n" + page.documentElement.outerHTML;
  }

  async function start() {
    if (loading) return;
    loading = true;

    const message = document.getElementById("loadingMessage");
    const retry = document.getElementById("retryButton");

    message.textContent = "우리 동네의 기회를 불러오는 중…";
    retry.hidden = true;

    let html;

    try {
      const page = await loadSource();
      html = redesign(page);
    } catch (error) {
      loading = false;
      retry.hidden = false;

      message.textContent =
        "사이트를 불러오지 못했어요.\n" +
        "인터넷 연결을 확인하고 다시 눌러 주세요.\n\n" +
        (
          error.name === "AbortError"
            ? "연결 시간이 초과됐어요."
            : error.message
        );

      return;
    }

    // 복구 안내창 없이 완성된 사이트를 바로 표시.
    document.open();
    document.write(html);
    document.close();
  }

  document.getElementById("retryButton").addEventListener(
    "click",
    start
  );

  start();
})();
</script>
</body>
</html>
