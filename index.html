<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f2f5f6">
<title>GY:ON — 나의 기회 보드</title>

<style id="dashboardStyle">
* {
  box-sizing: border-box;
}

:root {
  --ink: #293844;
  --muted: #7b8992;
  --line: #dfe6e9;
  --navy: #243e48;
  --mint: #8bd8ce;
}

body {
  margin: 0;
  background: #f2f5f6;
  color: var(--ink);
  font-family:
    Pretendard,
    "Malgun Gothic",
    system-ui,
    sans-serif;
}

button,
input,
select,
textarea {
  font: inherit;
}

button {
  cursor: pointer;
}

[hidden] {
  display: none !important;
}

button:focus-visible,
a:focus-visible {
  outline: 3px solid #8bd8ce;
  outline-offset: 3px;
}

.header {
  display: none;
}

.wrap {
  max-width: none;
  margin: 0;
  padding: 0;
}

.dashboard-main {
  margin-left: 244px !important;
  padding: 32px 40px !important;
  max-width: 1600px;
}

.sidebar {
  position: fixed;
  inset: 0 auto 0 0;
  width: 244px;
  padding: 30px 22px;
  background: #fff;
  border-right: 1px solid #e0e8eb;
  display: flex;
  flex-direction: column;
  overflow-y: auto;
  z-index: 10;
}

.sidebar .brand {
  display: block;
  text-decoration: none;
}

.sidebar .brand .logo {
  display: block;
  width: 154px;
  height: auto;
  max-width: 100%;
}

.side-caption {
  margin: 12px 0 30px;
  font-size: 11px;
  color: #97a2a7;
  line-height: 1.7;
}

.side-label {
  margin: 16px 12px;
  color: #a2aeb2;
  font-size: 10px;
  letter-spacing: 1.5px;
}

.nav {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin: 0;
  padding: 0;
  background: none;
  border: 0;
  border-radius: 0;
  overflow: visible;
}

.nav button,
.side-button {
  width: 100%;
  padding: 15px 13px;
  border: 0;
  border-radius: 11px;
  background: transparent;
  color: #72858f;
  text-align: left;
  white-space: normal;
  font-size: 12px;
  font-weight: 700;
  transition: background .2s;
}

.nav button.active,
.side-button.selected {
  background: var(--navy);
  color: #fff;
}

.nav button:hover:not(.active),
.side-button:hover:not(.selected) {
  background: #edf3f4;
  color: #385560;
}

.side-bottom {
  margin-top: auto;
  padding-top: 30px;
}

.side-note {
  padding: 17px;
  border-radius: 14px;
  background: #f4eee7;
  color: #8c7965;
}

.side-note b {
  font-size: 12px;
}

.side-note p {
  font-size: 11px;
  line-height: 1.8;
}

.sidebar #adminButton {
  width: 100%;
  margin-top: 16px;
  padding: 11px;
  border: 1px solid #dce4e8;
  border-radius: 10px;
  background: #fff;
  color: #78909a;
  font-size: 12px;
}

.dashboard-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 15px;
  margin-bottom: 18px;
}

.dashboard-top small {
  color: #9aa7ad;
  font-size: 10px;
  letter-spacing: 1.5px;
}

.dashboard-top h2 {
  margin: 7px 0 0;
  font-size: 26px;
  letter-spacing: -1px;
}

.connection-line {
  margin: 0 0 18px;
}

.connection {
  padding: 5px 0;
  background: transparent;
  color: #87999f;
  font-size: 11px;
  overflow-wrap: anywhere;
  white-space: pre-line;
}

.connection.error {
  padding: 10px;
  border-radius: 8px;
  background: #fff0e7;
  color: #a56948;
}

#reloadButton {
  padding: 7px 10px;
  border: 1px solid #dfe7eb;
  background: #fff;
  color: #78909a;
  font-size: 11px;
}

.hero {
  position: relative;
  display: grid;
  grid-template-columns: 1.5fr 1fr;
  align-items: center;
  gap: 20px;
  min-height: 320px;
  margin: 0;
  padding: 37px 42px;
  overflow: hidden;
  border: 0;
  border-radius: 24px;
  background: #273e48;
}

.hero .eyebrow {
  margin-bottom: 17px;
  color: #aac6c4;
  font-size: 10px;
  letter-spacing: 2px;
}

.hero h1 {
  margin: 0;
  color: #fff;
  font-size: clamp(30px, 3.5vw, 46px);
  line-height: 1.25;
  letter-spacing: -2px;
}

.hero h1 span {
  color: #f3ba92;
}

.hero p {
  margin: 18px 0;
  color: #b6c8cf;
  font-size: 13px;
  line-height: 1.9;
}

.hero-action {
  padding: 12px 17px;
  border: 0;
  border-radius: 9px;
  background: #f0b38e;
  color: #594735;
  font-size: 12px;
  font-weight: 750;
}

.stats {
  display: flex;
  flex-wrap: wrap;
  gap: 16px;
  margin-top: 23px;
  color: #b5c5cc;
  font-size: 11px;
}

.stats b {
  margin-right: 4px;
  color: #e6eeeb;
  font-size: 19px;
}

.hero-art {
  position: relative;
  display: grid;
  place-items: center;
  height: 250px;
  min-height: 250px;
  margin: 0;
  transform: none;
}

.hero-art::before {
  content: "";
  position: absolute;
  inset: 10px 20px;
  border-radius: 50%;
  background: #3a5359;
}

.hero-art .mascot {
  position: relative;
  width: 165px;
  height: 220px;
  filter: none;
  mix-blend-mode: normal;
}

.hero-art .float {
  position: absolute;
  top: 4px;
  right: 0;
  padding: 9px 11px;
  border: 0;
  border-radius: 8px;
  background: #f2ede1;
  color: #7b7f69;
  font-size: 10px;
  transform: rotate(5deg);
}

.hero-art .float.bottom {
  top: auto;
  right: auto;
  bottom: 3px;
  left: 0;
  background: #e4d099;
  transform: rotate(-5deg);
}

.quick-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
  margin: 20px 0;
}

.quick-card {
  padding: 21px 24px;
  border: 1px solid #dce6e8;
  border-radius: 16px;
  background: #e6eeec;
  color: #41615a;
  text-align: left;
}

.quick-card.help {
  border-color: #e8dfd1;
  background: #f1eae0;
  color: #88755b;
}

.quick-card span {
  display: block;
  font-size: 10px;
  letter-spacing: 1px;
  opacity: .7;
}

.quick-card b {
  display: block;
  margin: 11px 0 7px;
  font-size: 17px;
}

.quick-card p {
  margin: 0;
  font-size: 12px;
  line-height: 1.7;
}

.filters {
  margin: 0;
  padding: 22px;
  border: 1px solid #e0e7ea;
  border-radius: 16px;
  background: #fff;
}

.filter-grid {
  gap: 12px;
}

.filter-grid label {
  color: #78909a;
  font-size: 12px;
}

input,
select,
textarea {
  width: 100%;
  padding: 11px;
  border: 1px solid #dbe4e8;
  border-radius: 9px;
  background: #fcfdfd;
  color: #405964;
  font-size: 14px;
}

input:focus,
select:focus,
textarea:focus {
  outline: 2px solid #a4c5c8;
  border-color: #8fb6bb;
}

.section-title {
  gap: 12px;
  margin: 28px 0 18px;
}

.section-title h2 {
  color: #344f5c;
  font-size: 25px;
  letter-spacing: -.8px;
}

#resultCount {
  margin-top: 6px;
  color: #82979f;
  font-size: 12px;
}

.section-title > .badge {
  display: none;
}

.cards {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 16px;
}

.card {
  min-width: 0;
  gap: 14px;
  padding: 23px;
  border: 1px solid #dfe7eb;
  border-radius: 17px;
  background: #fff;
  box-shadow: none;
}

.card:hover {
  border-color: #b2c9cf;
}

.card h3 {
  color: #3b5561;
  font-size: 18px;
  line-height: 1.55;
  letter-spacing: -.5px;
  word-break: keep-all;
  overflow-wrap: anywhere;
}

.card p {
  color: #7c919b;
  font-size: 13px;
  line-height: 1.8;
}

.badge {
  align-self: flex-start;
  padding: 5px 8px;
  border-radius: 5px;
  background: #eaf0f3;
  color: #6d8796;
  font-size: 10px;
}

.badge.green {
  background: #e8f0e8;
  color: #759171;
}

.badge.pink {
  background: #faeae1;
  color: #b88768;
}

.price {
  color: #47656d;
  font-size: 27px;
  font-weight: 850;
}

.card .bottom {
  gap: 10px;
  padding-top: 14px;
  border-top: 1px solid #edf1f3;
}

.meta {
  color: #8398a2;
  font-size: 11px;
  line-height: 1.8;
}

.card .bottom .btn {
  flex-shrink: 0;
  padding: 9px 11px;
  border-radius: 8px;
  background: #eef3f4;
  color: #65848d;
  font-size: 11px;
}

/* 상품 사진을 잘라내거나 늘리지 않습니다. */
.card img {
  display: block;
  width: 100%;
  height: auto !important;
  aspect-ratio: 1.9 / 1;
  object-fit: contain !important;
  border-radius: 12px;
  background: #fffdf9;
}

.placeholder {
  display: grid;
  place-content: center;
  width: 100%;
  aspect-ratio: 1.9 / 1;
  padding: 20px;
  border-radius: 12px;
  background: #eef4f3;
  color: #78918e;
  text-align: center;
  font-size: 13px;
  line-height: 1.7;
}

.features {
  color: #78918e;
  font-size: 13px;
  line-height: 1.9;
}

.event-period,
.membership-meta {
  padding: 9px 11px;
  border-radius: 8px;
  background: #edf5f2;
  color: #53776e !important;
  font-size: 12px !important;
}

.empty {
  grid-column: 1 / -1;
  padding: 40px 20px;
  border: 1px dashed #cddde1;
  border-radius: 15px;
  background: #fff;
  color: #78909b;
  font-size: 13px;
  line-height: 1.9;
}

.btn {
  padding: 11px 16px;
  border: 0;
  border-radius: 9px;
  background: #2f4d58;
  color: #fff;
  font-size: 13px;
  font-weight: 700;
}

.btn.soft {
  background: #eaf0f1;
  color: #65858d;
}

.btn.white {
  border: 1px solid #dae5e9;
  background: #fff;
  color: #718e99;
}

.btn.danger {
  background: #fff0e9;
  color: #ad7059;
}

.admin {
  margin-top: 30px;
  border: 1px solid #d6e2e7;
  border-radius: 16px;
  background: #eaf0f2;
}

.admin-item {
  border: 1px solid #e0e8eb;
  border-radius: 10px;
  background: #fff;
}

dialog {
  max-width: calc(100vw - 28px);
  border: 1px solid #d7e3e7;
  border-radius: 20px;
  background: #fff;
  color: #365562;
  box-shadow: 0 25px 90px #233e4935;
}

dialog::backdrop {
  background: #213a4780;
  backdrop-filter: blur(5px);
}

.dialog-inner {
  padding: 26px;
}

.close {
  background: #edf2f4;
  color: #78909b;
}

.checkout-summary,
.receipt-table,
.note {
  background: #edf3f5;
}

.demo-banner {
  background: #fcf0d9;
  color: #927c51;
}

.upload-preview {
  grid-column: 1 / -1;
  padding: 16px;
  border: 1px dashed #abc8c4;
  border-radius: 12px;
}

.upload-preview img,
.shop-detail-image {
  display: block;
  width: 100%;
  max-height: 340px;
  object-fit: contain;
  border-radius: 12px;
  background: #f8faf9;
}

.upload-preview p {
  margin-bottom: 0;
  color: #597a78;
  font-size: 12px;
  line-height: 1.7;
}

.support-banner {
  margin-bottom: 20px;
  padding: 30px;
  border: 1px solid #dae5e0;
  border-radius: 20px;
  background: #e8eeec;
}

.support-banner h1 {
  margin: 12px 0;
  color: #46665d;
  font-size: 33px;
}

.support-banner p {
  color: #718a80;
  font-size: 14px;
  line-height: 1.8;
}

.faq-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  margin-bottom: 25px;
}

.faq-grid details {
  padding: 17px;
  border: 1px solid #e0e7e9;
  border-radius: 12px;
  background: #fff;
}

.faq-grid summary {
  color: #607d89;
  font-size: 13px;
  line-height: 1.6;
  cursor: pointer;
}

.faq-grid p {
  color: #78909a;
  font-size: 13px;
  line-height: 1.8;
}

.support-grid {
  display: grid;
  grid-template-columns: minmax(260px, .85fr) minmax(0, 1.5fr);
  gap: 22px;
  align-items: start;
}

.question-compose,
.question-card {
  padding: 24px;
  border: 1px solid #e0e7eb;
  border-radius: 18px;
  background: #fff;
}

.question-card {
  margin-top: 14px;
}

.question-compose h2,
.board-heading h2 {
  margin: 10px 0;
  color: #4e6a76;
  font-size: 23px;
}

.public-note,
.finder-note {
  padding: 13px;
  border-radius: 8px;
  background: #f7f0e5;
  color: #947d5f;
  font-size: 12px;
  line-height: 1.8;
}

#questionForm,
#finderForm {
  display: grid;
  gap: 9px;
}

#questionForm label,
#finderForm label {
  margin-top: 6px;
  color: #718b97;
  font-size: 12px;
}

#questionForm button,
#finderForm button {
  margin-top: 12px;
}

.board-heading,
.question-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
}

.question-top {
  flex-wrap: wrap;
}

.board-heading p,
.question-top small {
  color: #8b9fa9;
  font-size: 11px;
}

.q-tag {
  padding: 5px 8px;
  border-radius: 5px;
  background: #f5ebd9;
  color: #97815a;
  font-size: 11px;
}

.q-tag.answered {
  background: #e6efe9;
  color: #6d8d76;
}

.question-card h3 {
  margin: 17px 0 10px;
  color: #55717c;
  font-size: 17px;
  overflow-wrap: anywhere;
}

.preserve {
  color: #78909a;
  font-size: 13px;
  line-height: 1.9;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.answer-box {
  margin-top: 16px;
  padding: 15px;
  border-radius: 10px;
  background: #f0f5f4;
}

.answer-box b {
  color: #64867b;
  font-size: 12px;
}

.answer-form {
  margin-top: 16px;
  padding-top: 15px;
  border-top: 1px solid #e8eff1;
}

.q-actions {
  display: flex;
  gap: 10px;
  margin-top: 10px;
}

#supportStatus {
  color: #927958;
  font-size: 13px;
  line-height: 1.7;
  white-space: pre-line;
}

.finder-dialog {
  width: 480px;
}

.toast {
  border-radius: 10px;
  background: #304f58;
}

.footer {
  margin-top: 30px;
  padding: 22px 0;
  border-top: 1px solid #dfe7eb;
  color: #8b9da5;
  font-size: 11px;
}

.footer-logo {
  width: 100px;
  height: 30px;
}

#localCodebar,
.local-codebar {
  display: none !important;
}

.opening {
  display: grid;
  place-content: center;
  min-height: 100svh;
  padding: 25px;
  text-align: center;
}

.opening-logo {
  color: #243e48;
  font-size: 44px;
  font-weight: 900;
}

.opening p {
  color: #78909a;
  font-size: 14px;
  line-height: 1.9;
  white-space: pre-line;
}

@media (max-width: 1200px) {
  .dashboard-main {
    margin-left: 215px !important;
    padding: 25px !important;
  }

  .sidebar {
    width: 215px;
    padding: 25px 17px;
  }

  .cards {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .support-grid,
  .faq-grid {
    grid-template-columns: 1fr;
  }
}

@media (max-width: 760px) {
  .sidebar {
    position: static;
    display: block;
    width: 100%;
    padding: 18px;
    border-right: 0;
    border-bottom: 1px solid #dfe7ea;
  }

  .sidebar .brand .logo {
    width: 130px;
  }

  .side-caption,
  .side-label,
  .side-note {
    display: none;
  }

  .nav {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 7px;
    margin-top: 15px;
  }

  .nav button {
    padding: 12px;
    background: #edf2f4;
    font-size: 12px;
  }

  .side-button {
    width: auto;
    margin: 10px 4px 0 0;
    padding: 10px 12px;
  }

  .side-bottom {
    display: inline;
    padding: 0;
  }

  .sidebar #adminButton {
    width: auto;
    margin-top: 10px;
  }

  .dashboard-main {
    margin-left: 0 !important;
    padding: 22px 18px !important;
  }

  .dashboard-top h2 {
    font-size: 23px;
  }

  .hero {
    grid-template-columns: 1fr;
    gap: 10px;
    padding: 27px;
  }

  .hero h1 {
    font-size: 36px;
  }

  .hero-art {
    width: 230px;
    max-width: 100%;
    height: 210px;
    min-height: 210px;
    margin: auto;
  }

  .hero-art .mascot {
    width: 140px;
    height: 185px;
  }

  .quick-grid {
    gap: 10px;
  }

  .quick-card {
    padding: 17px;
  }

  .quick-card b {
    font-size: 15px;
    line-height: 1.5;
  }

  .filters {
    padding: 18px;
  }

  .filter-grid {
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }

  .filter-grid > div:last-child {
    grid-column: 1 / -1;
  }

  .cards {
    grid-template-columns: 1fr;
  }

  .dialog-inner {
    padding: 22px;
  }

  .support-banner {
    padding: 25px;
  }

  .support-banner h1 {
    font-size: 28px;
  }
}

@media (prefers-reduced-motion: reduce) {
  * {
    scroll-behavior: auto !important;
    transition: none !important;
    animation: none !important;
  }
}
</style>
</head>

<body>
<main class="opening">
  <div class="opening-logo">GY:ON</div>

  <p id="loadingMessage" role="status">
    오늘의 새로운 기회를 불러오는 중…
  </p>

  <button id="retryButton" class="btn" type="button" hidden>
    다시 불러오기
  </button>
</main>

        validDate(item.startDate) &&
        validDate(item.endDate)
      ) {
        return (
          "할인 기간: " +
          item.startDate.replaceAll("-", ".") +
          " ~ " +
          item.endDate.replaceAll("-", ".")
        );
      }

      return "할인 기간 미설정";
    }

    function selectField(id, values, selected, placeholder) {
      const input = $(id);
      const select = document.createElement("select");

      select.id = id;
      select.name = input.name;
      select.required = true;

      select.innerHTML =
        '<option value="">' +
        escapeHTML(placeholder) +
        "</option>" +
        values.map(value => (
          '<option value="' +
          escapeHTML(value) +
          '">' +
          escapeHTML(value) +
          "</option>"
        )).join("");

      select.value = values.includes(selected)
        ? selected
        : "";

      input.replaceWith(select);

      return select;
    }

    /*
     * 이미지가 실제로 열리는지 확인합니다.
     * 임시 주소나 잘못된 링크가 저장되는 일을 줄입니다.
     */
    function verifyImage(src) {
      return new Promise((resolve, reject) => {
        const image = new Image();

        const timer = setTimeout(() => {
          image.onload = null;
          image.onerror = null;
          image.src = "";

          reject(new Error(
            "사진을 불러오지 못했어요. " +
            "이미지 파일을 직접 선택해 주세요."
          ));
        }, 12000);

        image.onload = () => {
          clearTimeout(timer);

          if (!image.naturalWidth || !image.naturalHeight) {
            reject(new Error(
              "사진 크기를 확인할 수 없어요."
            ));
            return;
          }

          resolve(image);
        };

        image.onerror = () => {
          clearTimeout(timer);

          reject(new Error(
            "열리지 않는 이미지예요. " +
            "PNG, JPG, WEBP 파일을 직접 올려 주세요."
          ));
        };

        image.src = src;
      });
    }

    /*
     * 기존의 작은 420px 압축 대신 최대 1300px로 저장합니다.
     * 사진 비율을 유지하며 흰 배경으로 처리합니다.
     */
    compressImage = async function(file) {
      const allowed = [
        "image/png",
        "image/jpeg",
        "image/webp"
      ];

      if (!allowed.includes(file.type)) {
        throw new Error(
          "PNG, JPG, WEBP 이미지 파일을 선택해 주세요."
        );
      }

      if (file.size > 15 * 1024 * 1024) {
        throw new Error(
          "15MB 이하의 이미지 파일을 선택해 주세요."
        );
      }

      const url = URL.createObjectURL(file);

      try {
        const image = await verifyImage(url);

        const scale = Math.min(
          1,
          1300 / Math.max(
            image.naturalWidth,
            image.naturalHeight
          )
        );

        const canvas = document.createElement("canvas");

        canvas.width = Math.max(
          1,
          Math.round(image.naturalWidth * scale)
        );

        canvas.height = Math.max(
          1,
          Math.round(image.naturalHeight * scale)
        );

        const context = canvas.getContext("2d");

        if (!context) {
          throw new Error(
            "이 브라우저에서 이미지를 처리할 수 없어요."
          );
        }

        context.fillStyle = "#ffffff";
        context.fillRect(
          0,
          0,
          canvas.width,
          canvas.height
        );

        context.drawImage(
          image,
          0,
          0,
          canvas.width,
          canvas.height
        );

        let result = canvas.toDataURL(
          "image/webp",
          0.86
        );

        if (!result.startsWith("data:image/webp")) {
          result = canvas.toDataURL(
            "image/jpeg",
            0.86
          );
        }

        return result;
      } finally {
        URL.revokeObjectURL(url);
      }
    };

    /*
     * 사진 검증 후 기존 서버 저장 기능을 호출합니다.
     * 저장 실패 시 성공했다고 표시하지 않습니다.
     */
    const originalCommit = commit;

    commit = async function(key, original, item) {
      if (item && shopKeys.includes(key)) {
        if (
          !Number.isFinite(Number(item.price)) ||
          Number(item.price) < 0
        ) {
          throw new Error(
            "가격을 0원 이상으로 입력해 주세요."
          );
        }

        if (key === "membershipData") {
          item.validDays = Number(item.validDays);

          if (
            !Number.isInteger(item.validDays) ||
            item.validDays < 1 ||
            item.validDays > 3650
          ) {
            throw new Error(
              "이용 기간은 1~3650일로 입력해 주세요."
            );
          }

          item.target = String(
            item.target || "청소년"
          ).trim();

          item.benefits = String(
            item.benefits || ""
          ).trim();
        }

        if (item.img) {
          await verifyImage(item.img);
        }
      }

      return originalCommit(key, original, item);
    };

    /*
     * 관리자 등록·수정 창 확장
     */
    const originalEditor = openEditor;

    openEditor = function(index = null) {
      if (!admin || busy) return;

      originalEditor(index);

      if (!editing) return;

      const item = editing.original || {};

      if (
        ["mainData", "eventData"].includes(editing.key)
      ) {
        const map = regionMap();

        const city = selectField(
          "f-region",
          Object.keys(map),
          item.region || "",
          "시 / 군 선택"
        );

        const updateDong = selected => {
          const dong = selectField(
            "f-dong",
            map[city.value] || [],
            selected || "",
            "동 / 면 선택"
          );

          dong.disabled = !city.value;
        };

        updateDong(item.dong);

        city.addEventListener("change", () => {
          updateDong("");
        });
      }

      if (editing.key === "eventData") {
        $("fields").insertAdjacentHTML(
          "beforeend",
          field(
            "startDate",
            "할인 시작일",
            item.startDate || "",
            "date"
          ) +
          field(
            "endDate",
            "할인 종료일",
            item.endDate || "",
            "date"
          ) +
          '<p class="full muted">' +
          "시작일과 종료일을 포함한 할인 기간이에요." +
          "</p>"
        );

        const start = $("f-startDate");
        const end = $("f-endDate");

        start.required = true;
        end.required = true;
        end.min = start.value;

        start.addEventListener("input", () => {
          end.min = start.value;
        });
      }

      if (!shopKeys.includes(editing.key)) return;

      $("f-price").min = "0";
      $("f-price").step = "1";

      if (editing.key === "membershipData") {
        $("fields").insertAdjacentHTML(
          "beforeend",
          field(
            "validDays",
            "이용 기간 (일)",
            item.validDays || 30,
            "number"
          ) +
          field(
            "target",
            "구매 대상",
            item.target || "청소년",
            "text"
          ) +
          area(
            "benefits",
            "멤버십 혜택 (한 줄에 하나씩)",
            item.benefits || ""
          ) +
          '<p class="full muted">' +
          "청소년이 구매하는 멤버십 카드예요. " +
          "이용 조건과 제공 혜택을 적어 주세요." +
          "</p>"
        );

        $("f-validDays").min = "1";
        $("f-validDays").max = "3650";
        $("f-validDays").required = true;
      }

      const fileInput = $("f-file");
      const imageInput = $("f-img");

      fileInput.accept =
        "image/png,image/jpeg,image/webp";

      const fileNote =
        fileInput.parentElement.querySelector("p");

      if (fileNote) {
        fileNote.textContent =
          "사진 파일을 선택하면 미리보기를 확인할 수 있어요. " +
          "외부 주소가 만료될 수 있으니 파일 업로드를 권장해요.";
      }

      $("fields").insertAdjacentHTML(
        "beforeend",
        `
          <div class="upload-preview">
            <img
              id="productPreview"
              alt="등록할 상품 사진 미리보기"
              hidden
            >
            <p id="previewStatus" role="status">
              사진을 선택하면 여기에 미리 보여요.
            </p>
          </div>
        `
      );

      let previewVersion = 0;

      async function preview() {
        const version = ++previewVersion;
        const statusElement = $("previewStatus");
        const previewElement = $("productPreview");

        statusElement.textContent =
          "사진을 확인하는 중…";

        previewElement.hidden = true;

        try {
          const file = fileInput.files[0];

          const src = file
            ? await compressImage(file)
            : safeURL(imageInput.value, true);

          if (!src) {
            if (version === previewVersion) {
              statusElement.textContent =
                "사진 파일을 선택해 주세요.";
            }
            return;
          }

          await verifyImage(src);

          if (
            version !== previewVersion ||
            !previewElement.isConnected
          ) {
            return;
          }

          previewElement.src = src;
          previewElement.hidden = false;

          statusElement.textContent =
            "사진을 확인했어요. " +
            "저장하기를 누르면 반영돼요.";
        } catch (error) {
          if (
            version === previewVersion &&
            statusElement.isConnected
          ) {
            statusElement.textContent = error.message;
          }
        }
      }

      fileInput.addEventListener("change", preview);
      imageInput.addEventListener("change", preview);

      if (item.img) {
        preview();
      }
    };

    /*
     * 기존 저장 처리보다 먼저 날짜와 지역을 검사합니다.
     */
    $("editForm").addEventListener(
      "submit",
      event => {
        if (!admin || busy || !editing) return;

        let message = "";

        if (
          ["mainData", "eventData"].includes(editing.key)
        ) {
          const city = $("f-region").value;
          const dong = $("f-dong").value;

          if (!(regionMap()[city] || []).includes(dong)) {
            message =
              "등록된 시 / 군과 해당 동 / 면을 선택해 주세요.";
          }
        }

        if (
          !message &&
          editing.key === "eventData"
        ) {
          const start = $("f-startDate").value;
          const end = $("f-endDate").value;

          if (!validDate(start) || !validDate(end)) {
            message =
              "시작일과 종료일을 모두 선택해 주세요.";
          } else if (end < start) {
            message =
              "종료일은 시작일과 같거나 이후여야 해요.";
          }
        }

        if (message) {
          event.preventDefault();
          event.stopImmediatePropagation();

          $("editError").textContent = message;
          $("editError").hidden = false;
        }
      },
      true
    );

    /*
     * 목록에 할인 기간과 멤버십 이용 정보를 표시합니다.
     */
    const originalCards = renderCards;

    renderCards = function() {
      originalCards();

      if (
        !["eventData", "membershipData"].includes(tab)
      ) {
        return;
      }

      $("cards")
        .querySelectorAll("[data-detail]")
        .forEach(button => {
          const item =
            db[tab][Number(button.dataset.detail)];

          if (!item) return;

          const card = button.closest(".card");
          const line = document.createElement("p");

          if (tab === "eventData") {
            line.className = "event-period";
            line.textContent = period(item);
          } else {
            line.className = "membership-meta";

            line.textContent =
              (item.target || "청소년") +
              " · 이용 기간 " +
              (item.validDays || 30) +
              "일";

            button.textContent = "카드 가상 구매 ↗";
          }

          const bottom = card.querySelector(".bottom");

          if (bottom) {
            bottom.before(line);
          } else {
            card.appendChild(line);
          }
        });

      if (tab === "membershipData") {
        $("resultCount").textContent +=
          " · 청소년을 위한 멤버십";
      }
    };

    /*
     * 사진이 열리지 않을 때 깨진 이미지 아이콘 대신 안내합니다.
     */
    $("cards").addEventListener(
      "error",
      event => {
        const image = event.target;

        if (image.tagName !== "IMG") return;

        const placeholder =
          document.createElement("div");

        placeholder.className = "placeholder";
        placeholder.textContent =
          "사진을 불러올 수 없어요. " +
          "관리자에서 원본 사진을 다시 등록해 주세요.";

        image.replaceWith(placeholder);
      },
      true
    );

    /*
     * 상품 상세 화면에 사진과 멤버십 정보를 표시합니다.
     */
    const originalDetail = detail;

    detail = function(index) {
      originalDetail(index);

      document
        .getElementById("detailProductImage")
        ?.remove();

      const item = db[tab]?.[index];

      if (!item) return;

      if (tab === "eventData") {
        $("detailMeta").textContent +=
          " · " + period(item);
      }

      if (!shopKeys.includes(tab)) return;

      const imageURL = safeURL(item.img, true);

      if (imageURL) {
        const image = document.createElement("img");

        image.id = "detailProductImage";
        image.className = "shop-detail-image";
        image.alt = item.title || "상품 사진";
        image.src = imageURL;

        image.onerror = () => {
          image.remove();
        };

        $("detailText").before(image);
      }

      if (tab === "membershipData") {
        $("detailMeta").textContent +=
          " · " +
          (item.target || "청소년") +
          " · " +
          (item.validDays || 30) +
          "일";

        $("detailText").textContent = [
          item.desc,
          item.benefits
        ].filter(Boolean).join("\n\n");

        $("detailCheckout").textContent =
          "멤버십 카드 가상 구매 ↗";

        $("detailNote").textContent =
          "가상 구매 체험이에요. " +
          "실제 결제나 멤버십 카드 발급은 이루어지지 않아요.";
      }
    };
  }

  /*
   * 공개 Q&A와 맞춤 혜택 찾기
   */
  function installSupport() {
    let pendingQuestion = null;
    let supportBusy = false;

    const questionForm = $("questionForm");

    function showView(support) {
      $("exploreView").hidden = support;
      $("supportView").hidden = !support;

      $("helpNav").classList.toggle(
        "selected",
        support
      );

      $("pageName").textContent = support
        ? "고객센터 · Q&A"
        : "나의 기회 보드";

      if (support) {
        renderSupport();
      }
    }

    function renderSupport() {
      const items = Array.isArray(db.qnaData)
        ? db.qnaData
        : [];

      $("qnaCount").textContent =
        items.length + "개의 질문";

      $("qnaList").innerHTML = items.length
        ? items.slice().reverse().map(item => `
          <article class="question-card">
            <div class="question-top">
              <span class="q-tag ${
                item.answer ? "answered" : ""
              }">
                ${item.answer ? "답변 완료" : "답변 대기"}
              </span>

              <small>
                ${escapeHTML(
                  String(item.createdAt || "").slice(0, 10)
                )}
                ·
                ${escapeHTML(item.nickname || "방문자")}
              </small>
            </div>

            <h3>${escapeHTML(item.title)}</h3>

            <p class="preserve">${escapeHTML(item.body)}</p>

            ${
              item.answer
                ? `
                  <div class="answer-box">
                    <b>GY:ON 답변</b>
                    <p class="preserve">${
                      escapeHTML(item.answer)
                    }</p>
                  </div>
                `
                : ""
            }

            ${
              admin
                ? `
                  <form
                    class="answer-form"
                    data-qid="${escapeHTML(item.id)}"
                  >
                    <label>
                      관리자 답변
                      <textarea
                        name="answer"
                        rows="3"
                        maxlength="2000"
                        required
                      >${escapeHTML(item.answer || "")}</textarea>
                    </label>

                    <div class="q-actions">
                      <button class="btn" type="submit">
                        답변 저장
                      </button>

                      <button
                        class="btn danger"
                        type="button"
                        data-delete-question="${escapeHTML(item.id)}"
                      >
                        질문 삭제
                      </button>
                    </div>
                  </form>
                `
                : ""
            }
          </article>
        `).join("")
        : `
          <div class="empty">
            아직 등록된 질문이 없어요.<br>
            궁금한 내용을 첫 질문으로 남겨 봐.
          </div>
        `;
    }

    function lockSupport(value) {
      supportBusy = value;
      setBusy(value);

      document.querySelectorAll(
        "#supportView button," +
        "#supportView input," +
        "#supportView textarea"
      ).forEach(element => {
        element.disabled = value;
      });
    }

    const originalRenderAll = renderAll;

    renderAll = function() {
      originalRenderAll();
      renderSupport();
    };

    questionForm.addEventListener(
      "submit",
      async event => {
        event.preventDefault();

        if (busy || supportBusy) return;

        const title = $("qTitle").value.trim();
        const body = $("qBody").value.trim();

        const nickname =
          $("qNickname").value.trim() || "방문자";

        if (
          !title ||
          !body ||
          title.length > 100 ||
          body.length > 2000 ||
          nickname.length > 20
        ) {
          $("supportStatus").textContent =
            "제목과 내용을 입력하고 글자 수를 확인해 주세요.";
          return;
        }

        if (!ready) {
          $("supportStatus").textContent =
            "서버 연결 후 등록할 수 있어요. " +
            "‘새로고침’을 눌러 주세요.";
          return;
        }

        if (
          !pendingQuestion ||
          pendingQuestion.title !== title ||
          pendingQuestion.body !== body ||
          pendingQuestion.nickname !== nickname
        ) {
          pendingQuestion = {
            id:
              "q-" +
              Date.now() +
              "-" +
              Math.random().toString(36).slice(2),
            title,
            body,
            nickname,
            createdAt: new Date().toISOString(),
            answer: ""
          };
        }

        lockSupport(true);

        $("supportStatus").textContent =
          "질문을 저장하는 중…";

        try {
          await commit(
            "qnaData",
            null,
            pendingQuestion
          );

          if (
            !(db.qnaData || []).some(
              item => item.id === pendingQuestion.id
            )
          ) {
            throw new Error(
              "저장 결과를 확인하지 못했어요."
            );
          }

          pendingQuestion = null;
          questionForm.reset();

          $("supportStatus").textContent =
            "질문을 등록했어요. 목록에서 확인해 주세요.";
        } catch (error) {
          $("supportStatus").textContent =
            "등록 완료를 확인하지 못했어요. " +
            error.message +
            " 입력 내용은 유지돼요.";
        } finally {
          lockSupport(false);
        }
      }
    );

    $("qnaList").addEventListener(
      "submit",
      async event => {
        const form =
          event.target.closest(".answer-form");

        if (!form) return;

        event.preventDefault();

        if (!admin || busy || supportBusy) return;

        const original = (db.qnaData || []).find(
          item => String(item.id) === form.dataset.qid
        );

        const answer =
          form.querySelector("textarea").value.trim();

        if (
          !original ||
          !answer ||
          answer.length > 2000
        ) {
          return;
        }

        lockSupport(true);

        $("supportStatus").textContent =
          "답변을 저장하는 중…";

        try {
          await commit(
            "qnaData",
            clone(original),
            {
              ...clone(original),
              answer,
              answeredAt: new Date().toISOString()
            }
          );

          $("supportStatus").textContent =
            "답변을 저장했어요.";
        } catch (error) {
          $("supportStatus").textContent =
            "답변 저장 실패: " + error.message;
        } finally {
          lockSupport(false);
        }
      }
    );

    $("qnaList").addEventListener(
      "click",
      async event => {
        const button = event.target.closest(
          "[data-delete-question]"
        );

        if (
          !button ||
          !admin ||
          busy ||
          supportBusy
        ) {
          return;
        }

        const item = (db.qnaData || []).find(
          entry =>
            String(entry.id) ===
            button.dataset.deleteQuestion
        );

        if (
          !item ||
          !confirm("이 질문과 답변을 삭제할까요?")
        ) {
          return;
        }

        lockSupport(true);

        try {
          await commit(
            "qnaData",
            clone(item),
            null
          );

          $("supportStatus").textContent =
            "질문을 삭제했어요.";
        } catch (error) {
          $("supportStatus").textContent =
            "삭제 실패: " + error.message;
        } finally {
          lockSupport(false);
        }
      }
    );

    document.querySelectorAll("[data-help]")
      .forEach(button => {
        button.addEventListener(
          "click",
          () => showView(true)
        );
      });

    $("navigation").addEventListener(
      "click",
      () => showView(false)
    );

    $("supportReload").addEventListener(
      "click",
      async () => {
        if (busy) return;

        await load();

        $("supportStatus").textContent = ready
          ? "최신 목록을 불러왔어요."
          : "연결하지 못했어요. 연결 상태를 확인해 주세요.";
      }
    );

    const originalLogin =
      $("loginForm").onsubmit;

    $("loginForm").onsubmit = function(event) {
      originalLogin.call(this, event);
      renderSupport();
    };

    const originalLogout =
      $("logoutButton").onclick;

    $("logoutButton").onclick = function(event) {
      originalLogout.call(this, event);
      renderSupport();
    };

    function openFinder() {
      $("finderRegion").innerHTML =
        '<option value="">전체 지역</option>' +
        Object.keys(regionMap()).map(name =>
          "<option>" +
          escapeHTML(name) +
          "</option>"
        ).join("");

      $("finderDialog").showModal();
    }

    document.querySelectorAll("[data-finder]")
      .forEach(button => {
        button.addEventListener(
          "click",
          openFinder
        );
      });

    $("finderClose").addEventListener(
      "click",
      () => $("finderDialog").close()
    );

    $("finderForm").addEventListener(
      "submit",
      event => {
        event.preventDefault();

        const key = $("finderType").value;

        document.querySelector(
          '#navigation [data-tab="' + key + '"]'
        ).click();

        $("region").value =
          $("finderRegion").value;

        $("dong").value = "";
        fillDongs();

        $("age").value =
          $("finderAge").value;

        $("category").value = "";

        $("search").value =
          $("finderKeyword").value.trim();

        renderCards();
        $("finderDialog").close();

        $("cards").scrollIntoView({
          block: "start"
        });

        toast(
          "입력한 지역·나이·키워드 조건으로 찾았어요."
        );
      }
    );

    renderSupport();
  }

  /*
   * 기존 기본 코드에 멤버십 분기를 추가합니다.
   * 기존 서버 연결 설정과 결제 체험 기능은 유지합니다.
   */
  function upgradeCode(code) {
    code = code.replace(/\r\n?/g, "\n");

    code = code.replace(
      /const ADMIN_PASSWORD\s*=\s*"[^"]*"\s*;/,
      'const ADMIN_PASSWORD = "1103";'
    );

    code = code.replaceAll(
      'tab === "goodsData"',
      '["goodsData", "membershipData"].includes(tab)'
    );

    code = code.replaceAll(
      '["goodsData", "planData"]',
      '["goodsData", "membershipData", "planData"]'
    );

    code = code.replaceAll(
      'context.key === "goodsData"',
      '["goodsData", "membershipData"].includes(context.key)'
    );

    code = code.replaceAll(
      'key === "goodsData"',
      '["goodsData", "membershipData"].includes(key)'
    );

    code = code.replaceAll(
      "item.img.trim()",
      'String(item.img || "").trim()'
    );

    /*
     * 원본 마지막의 load()보다 먼저 확장 기능을 설치합니다.
     */
    const startup = /load\(\);\s*$/;

    if (!startup.test(code)) {
      throw new Error(
        "기본 사이트의 시작 위치를 확인하지 못했어요."
      );
    }

    code = code.replace(
      startup,
      "(" + installFeatures.toString() + ")();\n" +
      "(" + installSupport.toString() + ")();\n" +
      "load();"
    );

    return code;
  }

    return (

    );
  }

  async function request(url, json = false) {
    const controller = new AbortController();

    const timer = setTimeout(
      () => controller.abort(),
      15000
    );

    try {
      const response = await fetch(url, {
        signal: controller.signal,
        cache: "no-store",
        credentials: "omit"
      });

      if (!response.ok) {
        throw new Error(
          "서버 응답 오류: HTTP " +
          response.status
        );
      }

      return json
        ? await response.json()
        : await response.text();
    } finally {
      clearTimeout(timer);
    }
  }

  function parse(html) {
    const page = new DOMParser().parseFromString(
      html,
      "text/html"
    );

    const required = [
      ".hero",
      ".hero-art",
      ".section-title",
      "#stats",
      "#navigation",
      "#filters",
      "#cards",
      "#search",
      "#region",
      "#dong",
      "#age",
      "#category",
      "#adminButton",
      "#adminType",
      "#connection",
      "#editForm",
      "#fields",
      "#checkoutForm"
    ];

    if (
      required.some(
        selector => !page.querySelector(selector)
      )
    ) {
      throw new Error(
        "전체 사이트 코드를 받지 못했어요."
      );
    }

    return page;
  }

  async function loadSource() {
    const rawURL =
      "https://raw.githubusercontent.com/" +
      "hyun4115/gyon/" +
      revision +
      "/index.html";

    try {
      return parse(await request(rawURL));
    } catch (error) {
      const apiURL =
        "https://api.github.com/repos/" +
        "hyun4115/gyon/contents/index.html?ref=" +
        revision;

      const result = await request(
        apiURL,
        true
      );

      if (
        result.encoding !== "base64" ||
        typeof result.content !== "string"
      ) {
        throw new Error(
          "사이트를 불러오지 못했어요."
        );
      }

      const bytes = Uint8Array.from(
        atob(result.content.replace(/\s/g, "")),
        character => character.charCodeAt(0)
      );

      return parse(
        new TextDecoder().decode(bytes)
      );
    }
  }

  async function start() {
    if (loading) return;

    loading = true;

    const message =
      document.getElementById("loadingMessage");

    const retry =
      document.getElementById("retryButton");

    retry.hidden = true;

    message.textContent =
      "오늘의 새로운 기회를 불러오는 중…";

    let html;

    try {
      html = build(await loadSource());
    } catch (error) {
      loading = false;
      retry.hidden = false;

      message.textContent =
        "사이트를 불러오지 못했어요.\n" +
        "인터넷 연결을 확인하고 다시 눌러 주세요.\n\n" +
        (
          error.name === "AbortError"
            ? "연결 시간이 초과됐어요."
            : error.message
        );

      return;
    }

    document.open();
    document.write(html);
    document.close();
  }

  document.getElementById("retryButton")
    .addEventListener("click", start);

  window.addEventListener(
    "DOMContentLoaded",
    start,
    { once: true }
  );
})();
